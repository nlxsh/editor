<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>EditX — Pro Photo Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Anton&family=Archivo+Black&family=Audiowide&family=Bebas+Neue&family=Bungee&family=Caveat:wght@700&family=Cinzel:wght@700&family=Dancing+Script:wght@700&family=Fredoka:wght@600&family=Great+Vibes&family=Kaushan+Script&family=Lobster&family=Monoton&family=Montserrat:wght@700;900&family=Orbitron:wght@700&family=Oswald:wght@500;700&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:ital,wght@1,700&family=Poppins:wght@700&family=Press+Start+2P&family=Righteous&family=Satisfy&family=Yellowtail&family=Bangers&family=Titan+One&family=Alfa+Slab+One&family=Abril+Fatface&family=DM+Serif+Display&family=Bodoni+Moda:opsz,wght@6..96,700&family=Cormorant+Garamond:wght@700&family=Libre+Baskerville:wght@700&family=Merriweather:wght@900&family=Lora:wght@700&family=Fraunces:opsz,wght@9..144,900&family=Space+Grotesk:wght@700&family=Outfit:wght@800&family=Plus+Jakarta+Sans:wght@800&family=Lexend:wght@700&family=Syne:wght@800&family=Unbounded:wght@800&family=Raleway:wght@800&family=Nunito:wght@900&family=Quicksand:wght@700&family=DM+Sans:wght@800&family=Manrope:wght@800&family=Sora:wght@800&family=Work+Sans:wght@800&family=Rubik:wght@800&family=Shadows+Into+Light&family=Rock+Salt&family=Special+Elite&family=Parisienne&family=Sacramento&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090c;--s1:#11131a;--s2:#181b24;--s3:#222733;--ol:#282e3a;--ol2:#3a4150;--tx:#eef1f7;--mu:#96a0b2;--sv:#c8d0dd;--svh:#f4f6fb;--ok:#5ee7a0;--warn:#ffb347}
*,*::before,*::after{box-sizing:border-box}
html,body{max-width:100vw;overflow-x:hidden;margin:0;padding:0;height:100%}
[hidden]{display:none!important}
body{font-family:Inter,system-ui,sans-serif;background:#08090c;color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
img,video,canvas{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:.35rem;padding:.5rem .6rem;flex-wrap:nowrap;overflow:hidden;border-bottom:1px solid var(--ol);background:linear-gradient(180deg,rgba(26,30,38,.96),rgba(11,13,17,.98));backdrop-filter:blur(18px);z-index:10;flex:none}
.brand{display:flex;align-items:center;gap:.4rem;min-width:0;flex-shrink:1}
.brand-mark{display:grid;place-items:center;flex:none;width:2.2rem;height:2.2rem;border-radius:.65rem;background:linear-gradient(150deg,#fff,#d5dce8 35%,#8b95a6);color:#0a0c10;box-shadow:0 .25rem .9rem rgba(190,205,230,.22),inset 0 1px 0 rgba(255,255,255,.8)}
.brand-mark svg{width:1.15rem;height:1.15rem}
.brand-name{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;background:linear-gradient(180deg,#fff,#b8c2d0 60%,#8b95a6);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.appbar-actions{display:flex;align-items:center;gap:.22rem;flex-shrink:0}
.icon-btn{display:grid;place-items:center;width:2.35rem;height:2.35rem;border:1px solid transparent;border-radius:999px;color:var(--mu);transition:.15s;flex:none}
.icon-btn svg{width:1.1rem;height:1.1rem}
.icon-btn:hover{background:var(--s2);color:var(--tx);border-color:var(--ol)}
.icon-btn:active{transform:scale(.95)}
.icon-btn:disabled{opacity:.3;pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:2.35rem;padding:.4rem .85rem;border:1px solid transparent;border-radius:999px;background:var(--s2);color:var(--tx);font-weight:600;font-size:.82rem;white-space:nowrap;transition:.15s;flex:none}
.btn svg{width:.95rem;height:.95rem;flex:none}
.btn:hover{background:var(--s3)}
.btn:active{transform:scale(.97)}
.btn.filled{background:linear-gradient(180deg,#fff,#e2e7f0 50%,#b9c3d2);color:#0f1218;box-shadow:0 .25rem .9rem rgba(190,205,230,.22);border-color:rgba(255,255,255,.4)}
.btn.tonal{background:var(--s3);border-color:var(--ol2)}
.btn.full{width:100%}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background-color:#0b0d12;background-image:linear-gradient(45deg,#131620 25%,transparent 25%,transparent 75%,#131620 75%),linear-gradient(45deg,#131620 25%,transparent 25%,transparent 75%,#131620 75%);background-size:1.4rem 1.4rem;background-position:0 0,.7rem .7rem;touch-action:none;user-select:none}
.viewport{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.canvas-inner{position:relative;transform-origin:center center;will-change:transform}
#canvas{display:block;border-radius:.4rem;box-shadow:0 1rem 2.5rem rgba(0,0,0,.7);touch-action:none;user-select:none;cursor:crosshair;background:transparent}
.empty{position:absolute;inset:0;display:grid;place-items:center;gap:.9rem;text-align:center;padding:1.5rem;pointer-events:none}
.empty > *{pointer-events:auto}
.empty-icon{display:grid;place-items:center;width:4.6rem;height:4.6rem;border-radius:1.3rem;background:linear-gradient(150deg,#2a303c,#15181e);color:var(--sv);box-shadow:inset 0 0 0 1px var(--ol2),0 .8rem 2rem rgba(0,0,0,.5)}
.empty-icon svg{width:2rem;height:2rem}
.empty h3{margin:0;font-size:1.3rem;font-weight:800}
.empty p{margin:0;color:var(--mu);font-size:.88rem;line-height:1.5;max-width:26ch}
.stage-bar{position:absolute;top:.6rem;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:.15rem;padding:.3rem;border-radius:999px;background:rgba(15,17,22,.94);border:1px solid var(--ol);backdrop-filter:blur(12px);z-index:5;max-width:calc(100% - 1.2rem)}
.zoom-btn{display:grid;place-items:center;width:2rem;height:2rem;border-radius:999px;color:var(--mu);transition:.15s;flex:none}
.zoom-btn:hover{background:var(--s2);color:var(--tx)}
.zoom-btn svg{width:.95rem;height:.95rem}
.zoom-btn.locked{color:var(--ok);background:rgba(94,231,160,.15)}
.zoom-display{font-size:.72rem;font-weight:700;color:var(--sv);min-width:2.8rem;text-align:center;padding:0 .25rem;font-variant-numeric:tabular-nums}
.stage-bar .brush-indicator{display:grid;place-items:center;width:2rem;height:2rem;border-radius:999px;color:var(--mu);transition:.15s;flex:none;position:relative}
.stage-bar .brush-indicator svg{width:.95rem;height:.95rem}
.stage-bar .brush-indicator:hover{background:var(--s2);color:var(--tx)}
.stage-bar .brush-indicator.active{color:#0a1a10;background:linear-gradient(180deg,#5ee7a0,#2ea870);box-shadow:0 0 12px rgba(94,231,160,.55)}
.stage-bar .brush-indicator.active::after{content:"";position:absolute;top:-2px;right:-2px;width:.5rem;height:.5rem;border-radius:50%;background:#5ee7a0;box-shadow:0 0 6px #5ee7a0}
.brush-toggle{display:inline-flex;align-items:center;gap:.4rem;min-height:2.35rem;padding:.4rem .9rem;border-radius:999px;background:var(--s2);color:var(--mu);font-weight:700;font-size:.78rem;border:1px solid var(--ol);transition:.15s}
.brush-toggle svg{width:1.05rem;height:1.05rem}
.brush-toggle:hover{background:var(--s3);color:var(--tx)}
.brush-toggle.active{background:linear-gradient(180deg,#5ee7a0,#2ea870);color:#0a1a10;border-color:transparent;box-shadow:0 0 0 2px rgba(94,231,160,.25)}
.panel{display:flex;flex-direction:column;flex:none;max-height:56dvh;background:linear-gradient(180deg,rgba(21,24,31,.96),rgba(11,13,17,.99));border-top:1px solid var(--ol);backdrop-filter:blur(16px);transition:max-height .25s cubic-bezier(.4,0,.2,1)}
.panel.collapsed{max-height:0;overflow:hidden;border-top:0}
.tabs{display:flex;gap:.2rem;overflow-x:auto;overflow-y:hidden;padding:.5rem .6rem;border-bottom:1px solid var(--ol);scrollbar-width:none;background:rgba(8,9,12,.5);flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:.35rem;min-height:2.5rem;padding:.5rem .9rem;border:1px solid transparent;border-radius:999px;color:var(--mu);font-weight:600;font-size:.8rem;white-space:nowrap;flex:none;transition:.15s}
.tab svg{width:1.05rem;height:1.05rem}
.tab:hover{background:var(--s2);color:var(--tx)}
.tab.active{background:linear-gradient(180deg,#2e3546,#1c2029);color:var(--svh);border-color:var(--ol2)}
.panel-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem 1rem 1.4rem;display:flex;flex-direction:column;gap:1rem;min-height:0;scrollbar-width:thin}
.panel-body::-webkit-scrollbar{width:.4rem}
.panel-body::-webkit-scrollbar-thumb{background:var(--s3);border-radius:999px}
@media (min-width:64rem){
  .app{flex-direction:row;flex-wrap:wrap}
  .appbar{flex:0 0 100%;order:0}
  .stage{order:1;flex:1}
  .panel{order:2;flex:0 0 26rem;max-height:none;height:calc(100dvh - 3.35rem);border-top:0;border-left:1px solid var(--ol);transition:none}
  .panel.collapsed{max-height:none;flex:0 0 0;padding:0;border-left:0;overflow:hidden}
}
.head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.head h3{margin:0;font-size:1.05rem;font-weight:800}
.head-sub{font-size:.76rem;color:var(--mu);font-weight:500}
.label{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-top:.1rem}
.hint{font-size:.82rem;color:var(--mu);line-height:1.6;margin:0}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--ol),transparent);border:0;margin:.3rem 0}
.target-badge{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .7rem;border-radius:999px;background:var(--s3);border:1px solid var(--ol2);font-size:.74rem;font-weight:700;color:var(--svh)}
.target-badge svg{width:.85rem;height:.85rem}
.field{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.field-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.field-row label{font-size:.86rem;color:var(--mu);font-weight:500}
.field-row output{font-size:.8rem;color:var(--sv);font-variant-numeric:tabular-nums;background:var(--s2);padding:.22rem .6rem;border-radius:999px;border:1px solid var(--ol);min-width:3.2rem;text-align:center;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1.6rem;background:transparent;cursor:pointer;display:block;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:.4rem;border-radius:999px;background:linear-gradient(to right,var(--sv) 0%,var(--sv) var(--p,50%),var(--s3) var(--p,50%),var(--s3) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:1.35rem;height:1.35rem;margin-top:-.475rem;border-radius:50%;background:linear-gradient(180deg,#fff,#c8d0dd);box-shadow:0 0 0 .22rem rgba(200,212,232,.16),0 2px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:.4rem;border-radius:999px;background:var(--s3)}
input[type=range]::-moz-range-thumb{width:1.35rem;height:1.35rem;border:none;border-radius:50%;background:linear-gradient(180deg,#fff,#c8d0dd)}
input[type=color]{width:100%;height:2.9rem;padding:.25rem;border-radius:.55rem;border:1px solid var(--ol);background:var(--s2);cursor:pointer}
input[type=text],textarea{width:100%;padding:.75rem .85rem;border-radius:.55rem;border:1px solid var(--ol);background:var(--s2);color:var(--tx);font:inherit;min-width:0;resize:vertical;font-size:.9rem}
textarea{min-height:4rem;line-height:1.45}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--sv);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{min-height:2.3rem;padding:.45rem .95rem;border-radius:999px;border:1px solid var(--ol);background:var(--s2);color:var(--mu);font-size:.8rem;font-weight:600;transition:.15s}
.chip:hover{color:var(--tx);border-color:var(--ol2);background:var(--s3)}
.chip.active{background:linear-gradient(180deg,#fff,#c9d2e0);color:#0f1218;border-color:transparent;font-weight:700}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6rem,1fr));gap:.5rem}
.preset{display:flex;flex-direction:column;gap:.3rem;padding:.35rem;border:1px solid var(--ol);border-radius:.75rem;background:var(--s2);transition:.15s}
.preset:hover{background:var(--s3);transform:translateY(-1px)}
.preset.active{border-color:var(--sv);box-shadow:0 0 0 2px var(--sv) inset}
.preset-avatar{position:relative;width:100%;aspect-ratio:1/1;border-radius:.55rem;overflow:hidden;display:grid;place-items:center}
.preset-avatar::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.35),transparent 60%);pointer-events:none}
.preset-avatar svg{width:1.35rem;height:1.35rem;color:rgba(255,255,255,.96);position:relative;z-index:1}
.preset span{font-size:.68rem;text-align:center;color:var(--mu);padding:.05rem .1rem .15rem;font-weight:600;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preset.active span{color:var(--svh)}
.font-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr));gap:.45rem}
.font-chip{display:flex;flex-direction:column;gap:.15rem;align-items:center;min-height:4rem;padding:.6rem .4rem;border:1px solid var(--ol);border-radius:.75rem;background:var(--s2);transition:.15s}
.font-chip:hover{background:var(--s3);border-color:var(--ol2)}
.font-chip.active{border-color:var(--sv);box-shadow:0 0 0 1px var(--sv) inset}
.font-chip .fc-sample{font-size:1.15rem;line-height:1;color:var(--tx);font-weight:700}
.font-chip .fc-name{font-size:.6rem;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.graphics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.2rem,1fr));gap:.4rem}
.graphic-btn{display:grid;place-items:center;aspect-ratio:1/1;border:1px solid var(--ol);border-radius:.75rem;background:var(--s2);color:var(--sv);transition:.15s}
.graphic-btn svg{width:1.5rem;height:1.5rem}
.graphic-btn:hover{background:var(--s3);color:#fff;border-color:var(--ol2)}
.layer-list{display:flex;flex-direction:column;gap:.4rem}
.layer-row{display:grid;grid-template-columns:auto 1fr auto;gap:.55rem;align-items:center;padding:.55rem .7rem;border:1px solid var(--ol);border-radius:.75rem;background:var(--s2);transition:.15s;cursor:pointer}
.layer-row:hover{background:var(--s3)}
.layer-row.active{border-color:var(--sv);box-shadow:0 0 0 1px var(--sv) inset;background:linear-gradient(180deg,#232a38,#181c25)}
.layer-row.locked{opacity:.65}
.layer-icon{display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:.55rem;background:var(--s3);color:var(--sv);flex:none}
.layer-icon svg{width:1.15rem;height:1.15rem}
.layer-name{font-size:.85rem;font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:transparent;border:0;padding:.25rem .4rem;border-radius:.35rem;width:100%;min-width:0}
.layer-name:focus{background:var(--s1);border:1px solid var(--ol2);outline:none}
.layer-actions{display:flex;gap:.1rem;flex-wrap:nowrap}
.layer-btn{display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:.5rem;color:var(--mu);transition:.15s}
.layer-btn svg{width:1rem;height:1rem}
.layer-btn:hover{background:var(--s1);color:var(--tx)}
.layer-btn.on{color:var(--svh)}
.layer-btn.locked-on{color:var(--warn)}
.upload-hero{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:1.3rem .9rem;border-radius:1rem;border:1px dashed var(--ol2);background:linear-gradient(180deg,rgba(35,40,48,.5),rgba(23,26,33,.3));transition:.15s;text-align:center;width:100%}
.upload-hero:hover{border-color:var(--sv);background:linear-gradient(180deg,rgba(45,52,63,.6),rgba(28,32,40,.4))}
.upload-hero-icon{display:grid;place-items:center;width:2.8rem;height:2.8rem;border-radius:.85rem;background:linear-gradient(150deg,#fff,#d5dce8 35%,#8b95a6);color:#0a0c10;box-shadow:0 .3rem .9rem rgba(190,205,230,.22)}
.upload-hero-icon svg{width:1.3rem;height:1.3rem}
.upload-hero-title{font-size:.9rem;font-weight:700}
.upload-hero-desc{font-size:.76rem;color:var(--mu);line-height:1.45;max-width:28ch}
.swatch-row{display:flex;flex-wrap:wrap;gap:.35rem}
.swatch{width:2.3rem;height:2.3rem;border-radius:.55rem;border:2px solid transparent;transition:.14s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.swatch:hover{transform:scale(1.08)}
.swatch.active{border-color:var(--svh)}
.gradient-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(3rem,1fr));gap:.4rem}
.gradient{aspect-ratio:1/1;border-radius:.75rem;border:2px solid transparent;transition:.14s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.gradient.active{border-color:var(--svh)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr));gap:.5rem}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(4.5rem,1fr));gap:.45rem}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(3.5rem,1fr));gap:.4rem}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;min-height:3.8rem;padding:.7rem .5rem;border-radius:.75rem;border:1px solid var(--ol);background:var(--s2);color:var(--mu);font-size:.74rem;font-weight:600;text-align:center;transition:.15s}
.tile svg{width:1.25rem;height:1.25rem}
.tile:hover{background:var(--s3);color:var(--tx);border-color:var(--ol2)}
.tile.active{background:linear-gradient(180deg,#2e3546,#1c2029);color:var(--svh);border-color:var(--sv)}
.blend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.4rem,1fr));gap:.4rem}
.blend-btn{min-height:2.4rem;padding:.5rem .4rem;border-radius:.55rem;border:1px solid var(--ol);background:var(--s2);color:var(--mu);font-size:.75rem;font-weight:600;transition:.15s;text-align:center}
.blend-btn:hover{color:var(--tx);border-color:var(--ol2);background:var(--s3)}
.blend-btn.active{background:linear-gradient(180deg,#fff,#c9d2e0);color:#0f1218;border-color:transparent;font-weight:700}
.brush-modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.5rem,1fr));gap:.4rem}
.brush-mode{display:flex;flex-direction:column;align-items:center;gap:.3rem;min-height:3.6rem;padding:.55rem .4rem;border-radius:.65rem;border:1px solid var(--ol);background:var(--s2);color:var(--mu);font-size:.68rem;font-weight:700;transition:.15s;text-align:center}
.brush-mode svg{width:1.2rem;height:1.2rem}
.brush-mode.active{background:linear-gradient(180deg,#2e3546,#1c2029);color:var(--svh);border-color:var(--sv);box-shadow:0 0 0 1px var(--sv) inset}
.brush-preview{width:100%;height:2.6rem;border-radius:.55rem;background:var(--s3);display:grid;place-items:center;overflow:hidden}
.brush-dot{border-radius:50%;box-shadow:0 0 1.2rem rgba(200,215,235,.4)}
.switch{display:flex;align-items:center;gap:.6rem;font-size:.86rem;color:var(--mu);font-weight:500;cursor:pointer;min-height:2.6rem}
.switch input{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:2.5rem;height:1.4rem;border-radius:999px;background:var(--s3);cursor:pointer;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:.19rem;left:.19rem;width:1rem;height:1rem;border-radius:50%;background:var(--mu);transition:.2s}
.switch input:checked{background:linear-gradient(180deg,#fff,#c9d2e0)}
.switch input:checked::after{left:1.3rem;background:#0f1218}
.curve-wrap{display:flex;gap:.75rem;align-items:flex-start}
.curve-canvas{flex:1;aspect-ratio:1/1;background:#0c0e13;border:1px solid var(--ol);border-radius:.6rem;position:relative;touch-action:none;overflow:hidden;max-width:16rem}
.curve-canvas svg{width:100%;height:100%;display:block}
.curve-channels{display:flex;flex-direction:column;gap:.3rem;flex:none}
.curve-ch{width:2.4rem;height:2.4rem;border-radius:.5rem;border:1px solid var(--ol);background:var(--s2);color:var(--mu);font-weight:800;font-size:.72rem;display:grid;place-items:center;transition:.15s}
.curve-ch.active{background:var(--svh);color:#0f1218;border-color:transparent}
.curve-ch.r.active{background:#ff6b6b;color:#fff}
.curve-ch.g.active{background:#5ee7a0;color:#000}
.curve-ch.b.active{background:#54d6ff;color:#000}
@media (max-width:30rem){

    </div>
  </header>

  <section class="stage" id="stage">
    <div class="viewport" id="viewport">
      <div class="canvas-inner" id="canvasInner">

      </div>
    </div>
    <div class="stage-bar" id="stageBar" hidden>

      </button>
    </div>
    <div class="empty" id="empty">
      <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.6" cy="8.6" r="1.7"/><path d="M21 15.5l-4.6-4.6L6 21"/></svg></div>

    </div>
  </section>

  <aside class="panel collapsed" id="panel">
    <nav class="tabs" id="tabs"></nav>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>

function defaultCurves(){
  return {
    rgb: [{x:0,y:0},{x:1,y:1}],
    r:   [{x:0,y:0},{x:1,y:1}],
    g:   [{x:0,y:0},{x:1,y:1}],
    b:   [{x:0,y:0},{x:1,y:1}]
  };
}

function cloneCanvas(c){
  if(!c) return null;
  const n = document.createElement('canvas');
  n.width = c.width; n.height = c.height;
  n.getContext('2d').drawImage(c, 0, 0);
  return n;
}
function cloneCurves(c){
  return {
    active: c.active || 'rgb',
    rgb: c.rgb.map(p => ({x:p.x, y:p.y})),
    r: c.r.map(p => ({x:p.x, y:p.y})),
    g: c.g.map(p => ({x:p.x, y:p.y})),
    b: c.b.map(p => ({x:p.x, y:p.y}))
  };
}
function cloneLayer(o){
  const c = Object.assign({}, o);
  delete c.img;
  if(c.adj) c.adj = Object.assign({}, c.adj);
  if(c.curves) c.curves = cloneCurves(c.curves);
  if(c.strokes) c.strokes = c.strokes.map(s => ({ color:s.color, size:s.size, opacity:s.opacity, blend:s.blend, pts: s.pts.map(p => ({x:p.x, y:p.y})) }));
  if(c.maskStrokes) c.maskStrokes = c.maskStrokes.map(s => ({ size:s.size, opacity:s.opacity, pts: s.pts.map(p => ({x:p.x, y:p.y})) }));
  return c;
}

  const mw = Math.max(1, W - pad*2), mh = Math.max(1, H - pad*2);
  const s = Math.min(mw/iw, mh/ih);
  return { x:(W-iw*s)/2, y:(H-ih*s)/2, w: iw*s, h: ih*s };
}

function canvasSize(){

  const hasBgLayer = state.layers.some(function(o){ return o.type === 'background' && o.visible; });
  if(state.bg.type !== 'none' || hasBgLayer){
    const base = Math.max(img.width, img.height);

  }

}

function imageLayerDims(o, W, H){
  const img = o.img;
  if(!img) return { dw:0, dh:0 };
  const iw = img.width, ih = img.height;
  if(o.type === 'background' || o.fitMode === 'cover'){
    const s = Math.max(W/iw, H/ih);
    return { dw: iw*s, dh: ih*s };
  }
  const s = o.size * Math.min(W, H);
  const aspect = iw / ih;
  const dw = aspect >= 1 ? s : s * aspect;
  const dh = aspect >= 1 ? s / aspect : s;
  return { dw, dh };
}
function imageLayerCenter(o, W, H){
  return { cx: (o.x === undefined ? 0.5 : o.x) * W, cy: (o.y === undefined ? 0.5 : o.y) * H };
}

function applyView(){
  canvasInner.style.transform = 'translate(' + state.view.x + 'px,' + state.view.y + 'px) scale(' + state.view.scale + ')';
  zoomDisplay.textContent = Math.round(state.view.scale * 100) + '%';

function zoomBy(factor, cx, cy){
  if(state.view.locked){ flashLock(); return; }
  const prev = state.view.scale;
  let next = clamp(prev * factor, 0.1, 10);
  if(next === prev) return;
  if(cx !== undefined && cy !== undefined){
    const r = viewport.getBoundingClientRect();
    const px = cx - r.left - r.width/2;
    const py = cy - r.top - r.height/2;
    state.view.x = px - (px - state.view.x) * (next/prev);
    state.view.y = py - (py - state.view.y) * (next/prev);
  }
  state.view.scale = next;
  applyView();
}
function resetView(){ state.view.x = 0; state.view.y = 0; state.view.scale = 1; applyView(); }
function fitView(){
  if(!state.image) return;
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const s = Math.min(vw / canvas.width, vh / canvas.height) * 0.9;
  state.view.scale = clamp(s, 0.1, 10);
  state.view.x = 0; state.view.y = 0;
  applyView();
}

function restoreSnapshot(snap){
  state.preset = snap.preset;
  state.adj = Object.assign({}, snap.adj);
  state.bg = JSON.parse(JSON.stringify(snap.bg));
  state.curves = cloneCurves(snap.curves);
  state.image = snap.image ? cloneCanvas(snap.image) : null;
  state.baseVisible = snap.baseVisible !== false;
  state.baseLocked = !!snap.baseLocked;
  if(typeof snap.brushActive === 'boolean') state.brush.active = snap.brushActive;
  state.layers = snap.layers.map(ov => {
    const o = Object.assign({}, ov);
    if((o.type === 'image' || o.type === 'background') && o.src){
      const img = new Image();
      img.onload = function(){ baseDirty = true; requestRender(); };
      img.src = o.src;

}

function curveLUT(points){
  const pts = points.slice().sort((a,b) => a.x - b.x);
  const lut = new Uint8Array(256);
  for(let i = 0; i < 256; i++){
    const x = i / 255;
    let lo = pts[0], hi = pts[pts.length-1];
    for(let j = 0; j < pts.length - 1; j++){
      if(x >= pts[j].x && x <= pts[j+1].x){ lo = pts[j]; hi = pts[j+1]; break; }
    }
    const dx = hi.x - lo.x;
    const t = dx === 0 ? 0 : (x - lo.x) / dx;
    const y = lo.y + (hi.y - lo.y) * t;
    lut[i] = clamp(Math.round(y * 255), 0, 255);
  }
  return lut;
}
function curvesAreIdentity(c){
  const isId = (pts) => pts && pts.length === 2 && pts[0].x === 0 && pts[0].y === 0 && pts[1].x === 1 && pts[1].y === 1;
  return isId(c.rgb) && isId(c.r) && isId(c.g) && isId(c.b);
}
function applyCurvesToData(d, c){
  if(curvesAreIdentity(c)) return;
  const lutRGB = curveLUT(c.rgb);
  const lutR = curveLUT(c.r);
  const lutG = curveLUT(c.g);
  const lutB = curveLUT(c.b);
  for(let i = 0; i < d.length; i += 4){
    d[i]   = lutB[lutG[lutR[lutRGB[d[i]]]]];
    d[i+1] = lutB[lutG[lutR[lutRGB[d[i+1]]]]];
    d[i+2] = lutB[lutG[lutR[lutRGB[d[i+2]]]]];
  }
}

let rafId = null;
function requestRender(){ if(rafId) return; rafId = requestAnimationFrame(function(){ rafId = null; render(); }); }

function buildCSSFilter(adj, presetId){
  const a = adj; const parts = [];
  const p = PRESETS.find(f => f[0] === presetId);
  if(p && p[2]) parts.push(p[2]);
  if(a.brightness !== 100) parts.push('brightness(' + a.brightness + '%)');
  if(a.contrast !== 100)   parts.push('contrast(' + a.contrast + '%)');
  if(a.saturation !== 100) parts.push('saturate(' + a.saturation + '%)');
  if(a.hue !== 0)          parts.push('hue-rotate(' + a.hue + 'deg)');
  if(a.blur > 0)           parts.push('blur(' + a.blur + 'px)');
  if(a.exposure !== 0)     parts.push('brightness(' + (100 + a.exposure) + '%)');
  return parts.length ? parts.join(' ') : 'none';
}

function applyPixelFxToData(d, a){
  const need = a.temperature !== 0 || a.tint !== 0 || a.vibrance !== 0 ||
               a.highlights !== 0 || a.shadows !== 0 || a.fade !== 0 ||
               a.sharpen > 0 || a.clarity > 0 || a.noiseRed > 0 || a.grain > 0;
  if(!need) return false;
  const temp = a.temperature * 0.35;
  const tint = a.tint * 0.35;
  const vib = a.vibrance * 0.008;
  const hi = a.highlights * 0.4;
  const sh = a.shadows * 0.4;
  const fade = a.fade / 200;
  if(temp !== 0 || tint !== 0 || vib !== 0 || hi !== 0 || sh !== 0 || fade !== 0){
    for(let i = 0; i < d.length; i += 4){
      let r = d[i], g = d[i+1], b = d[i+2];
      if(temp !== 0){ r += temp; b -= temp; }
      if(tint !== 0){ g -= tint; r += tint * 0.5; b += tint * 0.5; }
      if(vib !== 0){
        const mx = r > g ? (r > b ? r : b) : (g > b ? g : b);
        const mn = r < g ? (r < b ? r : b) : (g < b ? g : b);
        const sat = mx > 0 ? (mx - mn) / mx : 0;
        const f = (1 - sat) * vib;
        const avg = (r + g + b) / 3;
        r += (r - avg) * f; g += (g - avg) * f; b += (b - avg) * f;
      }
      const l = (r + g + b) / 765;
      if(hi !== 0 && l > 0.5){ const f = (l - 0.5) * 2 * hi; r += f; g += f; b += f; }
      if(sh !== 0 && l < 0.5){ const f = (0.5 - l) * 2 * sh; r += f; g += f; b += f; }
      if(fade !== 0){ r += (255 - r) * fade; g += (255 - g) * fade; b += (255 - b) * fade; }
      d[i] = r < 0 ? 0 : r > 255 ? 255 : r;
      d[i+1] = g < 0 ? 0 : g > 255 ? 255 : g;
      d[i+2] = b < 0 ? 0 : b > 255 ? 255 : b;
    }
  }
  if(a.grain > 0){
    const amt = a.grain * 1.1;
    for(let i = 0; i < d.length; i += 4){
      const n = (Math.random() - .5) * amt;
      d[i] += n; d[i+1] += n; d[i+2] += n;
    }
  }
  return true;
}

function renderBase(W, H){
  if(baseCache.width !== W || baseCache.height !== H){
    baseCache.width = W; baseCache.height = H;
  }
  bctx.setTransform(1,0,0,1,0,0);
  bctx.clearRect(0,0,W,H);
  const img = state.image;
  if(!img) return;

  const bg = state.bg;
  const hasBgLayer = state.layers.some(function(o){ return o.type === 'background' && o.visible; });
  let imgRect = { x:0, y:0, w:W, h:H };

  if(bg.type === 'blur'){
    bctx.save();
    bctx.filter = 'blur(30px) brightness(.82) saturate(1.2)';
    const s = Math.max(W / img.width, H / img.height) * 1.18;
    const bw = img.width * s, bh = img.height * s;
    bctx.drawImage(img, (W-bw)/2, (H-bh)/2, bw, bh);
    bctx.restore();
    bctx.fillStyle = 'rgba(0,0,0,0.14)'; bctx.fillRect(0,0,W,H);
    imgRect = fitRect(img.width, img.height, W, H, Math.min(W,H)*0.09);
  } else if(bg.type === 'solid'){
    bctx.fillStyle = bg.color; bctx.fillRect(0,0,W,H);
    imgRect = fitRect(img.width, img.height, W, H, Math.min(W,H)*0.07);
  } else if(bg.type === 'gradient'){
    const g = bctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0, bg.g[0]); g.addColorStop(1, bg.g[1]);
    bctx.fillStyle = g; bctx.fillRect(0,0,W,H);
    imgRect = fitRect(img.width, img.height, W, H, Math.min(W,H)*0.07);
  } else if(hasBgLayer){
    imgRect = fitRect(img.width, img.height, W, H, Math.min(W,H)*0.08);
  }

  for(let i = 0; i < state.layers.length; i++){
    const o = state.layers[i];
    if(!o.visible) continue;
    if(o.type !== 'background') continue;
    drawImageLayer(bctx, o, W, H);
  }

  if(state.baseVisible){
    bctx.save();
    bctx.filter = buildCSSFilter(state.adj, state.preset);
    bctx.imageSmoothingEnabled = true; bctx.imageSmoothingQuality = 'high';
    bctx.drawImage(img, imgRect.x, imgRect.y, imgRect.w, imgRect.h);
    bctx.restore();

    const id = bctx.getImageData(0, 0, W, H);
    const changed = applyPixelFxToData(id.data, state.adj);
    const curvesChanged = !curvesAreIdentity(state.curves);
    if(curvesChanged) applyCurvesToData(id.data, state.curves);
    if(changed || curvesChanged) bctx.putImageData(id, 0, 0);

    if(state.adj.vignette > 0){
      const g = bctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.76);
      g.addColorStop(0,'rgba(0,0,0,0)');
      g.addColorStop(1,'rgba(0,0,0,' + (state.adj.vignette/100*0.86) + ')');
      bctx.fillStyle = g; bctx.fillRect(0,0,W,H);
    }
  }

  for(let i = 0; i < state.layers.length; i++){
    const o = state.layers[i];
    if(!o.visible) continue;
    if(o.type !== 'image') continue;
    drawImageLayer(bctx, o, W, H);
  }
}

function drawImageLayer(c, o, W, H){
  const img = o.img;
  if(!img || !img.complete || !img.width) return;
  const dims = imageLayerDims(o, W, H);
  const dw = dims.dw, dh = dims.dh;
  if(dw < 1 || dh < 1) return;
  const ctr = imageLayerCenter(o, W, H);

  const hasPreset = o.preset && o.preset !== 'none';
  const hasLayerAdj = o.adj && JSON.stringify(o.adj) !== JSON.stringify(DEFAULT_ADJ);
  const hasLayerCurves = o.curves && !curvesAreIdentity(o.curves);
  const hasMask = o.maskStrokes && o.maskStrokes.length;

  if(!hasPreset && !hasLayerAdj && !hasLayerCurves && !hasMask){
    c.save();
    c.globalAlpha = (o.opacity === undefined ? 1 : o.opacity);
    if(o.blend && o.blend !== 'normal') c.globalCompositeOperation = o.blend;
    c.translate(ctr.cx, ctr.cy);
    c.rotate(degToRad(o.rotation || 0));
    c.drawImage(img, -dw/2, -dh/2, dw, dh);
    c.restore();
    return;
  }

  const tmpW = Math.max(1, Math.round(dw));
  const tmpH = Math.max(1, Math.round(dh));
  const off = document.createElement('canvas');
  off.width = tmpW; off.height = tmpH;
  const octx = off.getContext('2d');

  if(hasPreset || hasLayerAdj){
    octx.save();
    octx.filter = buildCSSFilter(o.adj || DEFAULT_ADJ, o.preset || 'none');
    octx.drawImage(img, 0, 0, tmpW, tmpH);
    octx.restore();
  } else {
    octx.drawImage(img, 0, 0, tmpW, tmpH);
  }

  if(hasLayerAdj || hasLayerCurves){
    const idata = octx.getImageData(0, 0, tmpW, tmpH);
    let changed = false;
    if(hasLayerAdj) changed = applyPixelFxToData(idata.data, o.adj) || changed;
    if(hasLayerCurves){ applyCurvesToData(idata.data, o.curves); changed = true; }
    if(changed) octx.putImageData(idata, 0, 0);
  }

  if(hasMask){
    octx.globalCompositeOperation = 'destination-out';
    for(let k = 0; k < o.maskStrokes.length; k++){
      const s = o.maskStrokes[k];
      octx.strokeStyle = 'rgba(0,0,0,' + (s.opacity || 1) + ')';
      octx.lineWidth = s.size * Math.min(W, H);
      octx.lineCap = 'round'; octx.lineJoin = 'round';
      octx.beginPath();
      for(let j = 0; j < s.pts.length; j++){
        const p = s.pts[j];
        const x = (p.x - ctr.cx / W + 0.5) * dw;
        const y = (p.y - ctr.cy / H + 0.5) * dh;
        if(j === 0) octx.moveTo(x, y); else octx.lineTo(x, y);
      }
      octx.stroke();
    }
  }

  c.save();
  c.globalAlpha = (o.opacity === undefined ? 1 : o.opacity);
  if(o.blend && o.blend !== 'normal') c.globalCompositeOperation = o.blend;
  c.translate(ctr.cx, ctr.cy);
  c.rotate(degToRad(o.rotation || 0));
  c.drawImage(off, -dw/2, -dh/2, dw, dh);
  c.restore();
}

function drawBrushBadge(c, W, H){
  const badgeSize = Math.max(36, Math.min(W, H) * 0.075);
  const pad = badgeSize * 0.32;
  const x = pad, y = pad;
  const r = badgeSize * 0.28;

  c.save();
  c.fillStyle = 'rgba(94,231,160,0.96)';
  c.beginPath();
  if(typeof c.roundRect === 'function'){
    c.roundRect(x, y, badgeSize, badgeSize, r);
  } else {
    c.moveTo(x + r, y);
    c.lineTo(x + badgeSize - r, y);
    c.quadraticCurveTo(x + badgeSize, y, x + badgeSize, y + r);
    c.lineTo(x + badgeSize, y + badgeSize - r);
    c.quadraticCurveTo(x + badgeSize, y + badgeSize, x + badgeSize - r, y + badgeSize);
    c.lineTo(x + r, y + badgeSize);
    c.quadraticCurveTo(x, y + badgeSize, x, y + badgeSize - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }
  c.fill();

  c.shadowColor = 'rgba(94,231,160,0.65)';
  c.shadowBlur = badgeSize * 0.5;
  c.beginPath();
  c.arc(x + badgeSize/2, y + badgeSize/2, badgeSize/2, 0, Math.PI*2);
  c.fill();
  c.shadowBlur = 0;
  c.restore();

  const is = (badgeSize * 0.68) / 24;
  c.save();
  c.translate(x + badgeSize/2 - 12*is, y + badgeSize/2 - 12*is);
  c.scale(is, is);
  const p = new Path2D('M4 20c2-2 6-2 8-4l6-6-2-2-6 6c-2 2-2 6-4 8l-2-2z');
  c.fillStyle = '#0a1a10';
  c.fill(p);
  c.restore();
}

function render(exportMode){
  const img = state.image;
  if(!img){ canvas.hidden = true; emptyEl.hidden = false; stageBar.hidden = true; return; }
  canvas.hidden = false; emptyEl.hidden = true; stageBar.hidden = false;

  const size = canvasSize();
  const W = Math.max(1, Math.round(size.w));
  const H = Math.max(1, Math.round(size.h));
  if(canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; baseDirty = true; }

  if(baseDirty){ renderBase(W, H); baseDirty = false; }

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(baseCache, 0, 0);

  for(let i = 0; i < state.layers.length; i++){
    const o = state.layers[i];
    if(!o.visible) continue;
    if(o.type === 'image' || o.type === 'background') continue;
    drawLayer(ctx, o, W, H);
  }

  if(!exportMode){
    if(state.tab === 'crop' && state.crop.active){
      drawCropUI(ctx, W, H);
    } else {
      drawSelectionUI(ctx, W, H);
    }
    if(state.brush.active){
      drawBrushBadge(ctx, W, H);
    }
  }
}

function fontString(o, size){
  const weight = o.bold ? '700' : '400';
  const style = o.italic ? 'italic ' : '';
  return style + weight + ' ' + size + 'px "' + o.font + '", sans-serif';
}
function shadeHex(hex, amt){
  hex = hex.replace('#','');
  if(hex.length === 3) hex = hex.split('').map(c => c+c).join('');
  let r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
  if(amt > 0){ r += (255-r)*amt; g += (255-g)*amt; b += (255-b)*amt; }
  else { r *= (1+amt); g *= (1+amt); b *= (1+amt); }
  return '#' + [r,g,b].map(v => Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
}

function drawTextLine(c, text, x, y, o, size){
  const effect = o.effect || 'Plain';
  c.save(); c.textAlign = o.align || 'center'; c.textBaseline = 'middle';
  const strokeW = Math.max(1, (o.strokeWidth/100) * size);
  c.lineJoin = 'round'; c.miterLimit = 2;
  if(effect === 'Chrome'){
    c.fillStyle = 'rgba(0,0,0,0.55)'; c.fillText(text, x + size*0.012, y + size*0.03);
    c.strokeStyle = '#0c0d10'; c.lineWidth = strokeW + size*0.02; c.strokeText(text, x, y);
    const grad = c.createLinearGradient(0, y - size*0.7, 0, y + size*0.7);
    grad.addColorStop(0,'#fff'); grad.addColorStop(0.18,'#e8eef7'); grad.addColorStop(0.38,'#a8b3c2');
    grad.addColorStop(0.5,'#697585'); grad.addColorStop(0.52,'#8f9bac'); grad.addColorStop(0.72,'#c9d2e0');
    grad.addColorStop(1,'#f4f6fb');
    c.fillStyle = grad; c.fillText(text, x, y);
    const hg = c.createLinearGradient(0, y - size*0.6, 0, y - size*0.15);
    hg.addColorStop(0,'rgba(255,255,255,0.95)'); hg.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle = hg; c.fillText(text, x, y);
    c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = Math.max(1,strokeW*0.35); c.strokeText(text, x, y);
  } else if(effect === 'Metallic'){
    const c1 = o.color || '#c8d0dd';
    const dark = shadeHex(c1, -0.55), lite = shadeHex(c1, 0.35);
    c.fillStyle = 'rgba(0,0,0,0.5)'; c.fillText(text, x + size*0.014, y + size*0.034);
    c.strokeStyle = '#0a0c10'; c.lineWidth = strokeW + size*0.018; c.strokeText(text, x, y);
    const grad = c.createLinearGradient(0, y - size*0.7, 0, y + size*0.7);
    grad.addColorStop(0, lite); grad.addColorStop(0.4, c1); grad.addColorStop(0.5, dark);
    grad.addColorStop(0.6, c1); grad.addColorStop(1, lite);
    c.fillStyle = grad; c.fillText(text, x, y);
    c.strokeStyle = 'rgba(255,255,255,0.4)'; c.lineWidth = Math.max(1,strokeW*0.4); c.strokeText(text, x, y);
  } else if(effect === 'Emboss'){
    const d = size * 0.028;
    c.fillStyle = 'rgba(0,0,0,0.7)'; c.fillText(text, x - d, y - d);
    c.fillStyle = 'rgba(255,255,255,0.85)'; c.fillText(text, x + d, y + d);
    c.strokeStyle = '#0a0c10'; c.lineWidth = Math.max(1,strokeW*0.4); c.strokeText(text, x, y);
    c.fillStyle = o.color || '#eef2f8'; c.fillText(text, x, y);
  } else if(effect === 'Glow'){
    c.fillStyle = o.color; c.shadowColor = o.color;
    c.shadowBlur = size * 0.7;
    for(let i = 0; i < 3; i++) c.fillText(text, x, y);
    c.shadowBlur = 0;
    c.fillStyle = '#ffffff'; c.fillText(text, x, y);
  } else if(effect === 'Gradient'){
    const c1 = o.color || '#ff5d8f';
    const c2 = o.color2 || '#ffcb3e';
    if(strokeW > 0){
      c.strokeStyle = o.stroke || '#000';
      c.lineWidth = strokeW + size*0.02;
      c.strokeText(text, x, y);
    }
    const grad = c.createLinearGradient(0, y - size*0.5, 0, y + size*0.5);
    grad.addColorStop(0, c1); grad.addColorStop(1, c2);
    c.fillStyle = grad; c.fillText(text, x, y);
  } else if(effect === 'Reflective'){
    const base = o.color || '#c8d0dd';
    const dark = shadeHex(base, -0.6), lite = shadeHex(base, 0.4);
    c.fillStyle = 'rgba(0,0,0,0.5)'; c.fillText(text, x + size*0.012, y + size*0.032);
    c.strokeStyle = '#0c0d10'; c.lineWidth = strokeW + size*0.018; c.strokeText(text, x, y);
    const grad = c.createLinearGradient(0, y - size*0.75, 0, y + size*0.75);
    grad.addColorStop(0, lite); grad.addColorStop(0.35, base); grad.addColorStop(0.5, dark);
    grad.addColorStop(0.51, lite); grad.addColorStop(1, dark);
    c.fillStyle = grad; c.fillText(text, x, y);
    c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = Math.max(1,strokeW*0.35); c.strokeText(text, x, y);
  } else if(effect === 'Neon'){
    c.fillStyle = o.color; c.shadowColor = o.color;
    for(let i = 0; i < 3; i++){ c.shadowBlur = size * (0.25 + i * 0.4); c.fillText(text, x, y); }
    c.shadowBlur = 0; c.fillStyle = '#fff'; c.fillText(text, x, y);
  } else if(effect === 'Shadow'){
    c.shadowColor = o.shadow || 'rgba(0,0,0,0.7)';
    c.shadowBlur = size * 0.28; c.shadowOffsetY = size * 0.09; c.shadowOffsetX = size * 0.04;
    c.fillStyle = o.color; c.fillText(text, x, y);
  } else if(effect === 'Outline'){
    c.strokeStyle = o.stroke || '#000'; c.lineWidth = strokeW; c.strokeText(text, x, y);
    c.fillStyle = o.color; c.fillText(text, x, y);
  } else if(effect === '3D'){
    const d = size * 0.045;
    c.fillStyle = o.shadow || '#000';
    for(let i = 4; i >= 1; i--) c.fillText(text, x + d*i*0.65, y + d*i);
    if(o.strokeWidth > 0 && o.stroke){ c.strokeStyle = o.stroke; c.lineWidth = strokeW; c.strokeText(text, x, y); }
    c.fillStyle = o.color; c.fillText(text, x, y);
  } else {
    if(o.strokeWidth > 0 && o.stroke){ c.strokeStyle = o.stroke; c.lineWidth = strokeW; c.strokeText(text, x, y); }
    c.fillStyle = o.color; c.fillText(text, x, y);
  }
  c.restore();
}

function drawLayer(c, o, W, H){
  c.save();
  c.globalAlpha = (o.opacity === undefined ? 1 : o.opacity);
  if(o.blend && o.blend !== 'normal') c.globalCompositeOperation = o.blend;
  c.translate(o.x * W, o.y * H);
  c.rotate(degToRad(o.rotation || 0));

  if(o.type === 'text'){
    const size = o.size * H;
    c.font = fontString(o, size);
    if('letterSpacing' in c) c.letterSpacing = ((o.spacing || 0) * size / 100) + 'px';
    const lines = String(o.text).split('\n');
    const lineH = size * (o.lineHeight || 1.16);
    const startY = -((lines.length - 1) * lineH) / 2;
    for(let i = 0; i < lines.length; i++){
      const line = o.uppercase ? lines[i].toUpperCase() : (o.lowercase ? lines[i].toLowerCase() : lines[i]);
      drawTextLine(c, line, 0, startY + i*lineH, o, size);
    }
    if('letterSpacing' in c) c.letterSpacing = '0px';
  } else if(o.type === 'graphic'){
    const s = o.size * Math.min(W, H);
    const p = new Path2D(o.d);
    c.save();
    c.translate(-s/2, -s/2);
    c.scale(s/24, s/24);
    if(o.fill){ c.fillStyle = o.color; c.fill(p); }
    if(o.strokeW > 0){
      c.strokeStyle = o.color;
      c.lineWidth = o.strokeW;
      c.lineJoin = 'round'; c.lineCap = 'round';
      c.stroke(p);
    }
    c.restore();
  } else if(o.type === 'paint' && o.strokes){
    const sMin = Math.min(W, H);
    for(let i = 0; i < o.strokes.length; i++){
      const s = o.strokes[i];
      c.save();
      c.globalAlpha = (o.opacity === undefined ? 1 : o.opacity) * (s.opacity || 1);
      c.globalCompositeOperation = s.blend || 'source-over';
      c.strokeStyle = s.color || '#fff';
      c.lineWidth = s.size * sMin;
      c.lineCap = 'round'; c.lineJoin = 'round';
      c.beginPath();
      for(let j = 0; j < s.pts.length; j++){
        const p = s.pts[j];
        if(j === 0) c.moveTo((p.x - 0.5) * W, (p.y - 0.5) * H);
        else c.lineTo((p.x - 0.5) * W, (p.y - 0.5) * H);
      }
      c.stroke();
      c.restore();
    }
  }
  c.restore();
}

function layerBounds(o, W, H){
  if(o.type === 'text'){
    const size = o.size * H;
    ctx.save(); ctx.font = fontString(o, size);
    const lines = String(o.text).split('\n');
    let maxW = 1;
    for(let i = 0; i < lines.length; i++) maxW = Math.max(maxW, ctx.measureText(lines[i]).width);
    ctx.restore();
    const h = lines.length * size * (o.lineHeight || 1.16);
    return { x: o.x*W - maxW/2, y: o.y*H - h/2, w: maxW, h };
  }
  if((o.type === 'image' || o.type === 'background') && o.img){
    const dims = imageLayerDims(o, W, H);
    const ctr = imageLayerCenter(o, W, H);
    return { x: ctr.cx - dims.dw/2, y: ctr.cy - dims.dh/2, w: dims.dw, h: dims.dh };
  }
  const s = o.size * Math.min(W, H);
  return { x: o.x*W - s/2, y: o.y*H - s/2, w: s, h: s };
}

function rotateHandlePos(o, b, W, H){
  const pad = cssToCanvasPx(8), off = cssToCanvasPx(46);
  const ly = -b.h/2 - pad - off;
  const r = rot(0, ly, degToRad(o.rotation || 0));
  return { x: o.x*W + r.x, y: o.y*H + r.y };
}

function hitCorner(p, o, W, H){
  if(o.type === 'paint' || o.type === 'background') return null;
  if(!o.img && o.type !== 'image' && o.type !== 'text' && o.type !== 'graphic') return null;
  const b = layerBounds(o, W, H);
  const pad = cssToCanvasPx(8);
  const anchorX = (o.type === 'image') ? (o.x === undefined ? 0.5 : o.x) : o.x;
  const anchorY = (o.type === 'image') ? (o.y === undefined ? 0.5 : o.y) : o.y;
  const cx = anchorX * W, cy = anchorY * H;
  const a = -degToRad(o.rotation || 0);
  const dx = p.x - cx, dy = p.y - cy;
  const lx = dx * Math.cos(a) - dy * Math.sin(a);
  const ly = dx * Math.sin(a) + dy * Math.cos(a);
  const hw = b.w/2 + pad, hh = b.h/2 + pad;
  const hs = cssToCanvasPx(24);
  const corners = [
    ['nw', -hw, -hh],
    ['ne', hw, -hh],
    ['sw', -hw, hh],
    ['se', hw, hh]
  ];
  for(let i = 0; i < corners.length; i++){
    if(Math.hypot(lx - corners[i][1], ly - corners[i][2]) < hs) return corners[i][0];
  }
  return null;
}

function drawSelectionUI(c, W, H){
  const idx = state.selected;
  if(idx < 0 || !state.layers[idx]) return;
  const o = state.layers[idx];
  if(!o.visible || o.locked) return;
  if(o.type === 'paint') return;
  const b = layerBounds(o, W, H);
  const pad = cssToCanvasPx(8), lw = cssToCanvasPx(2), hs = cssToCanvasPx(15), hr = cssToCanvasPx(12);
  const off = cssToCanvasPx(46), dl = cssToCanvasPx(8), dg = cssToCanvasPx(6);

  const anchorX = (o.type === 'image' || o.type === 'background') ? (o.x === undefined ? 0.5 : o.x) : o.x;
  const anchorY = (o.type === 'image' || o.type === 'background') ? (o.y === undefined ? 0.5 : o.y) : o.y;
  const localX = b.x + b.w/2 - anchorX * W;
  const localY = b.y + b.h/2 - anchorY * H;

  c.save();
  c.translate(anchorX * W, anchorY * H);
  c.rotate(degToRad(o.rotation || 0));
  c.strokeStyle = 'rgba(233,236,242,0.95)'; c.lineWidth = lw;
  c.setLineDash([dl, dg]);
  c.strokeRect(localX - b.w/2 - pad, localY - b.h/2 - pad, b.w + pad*2, b.h + pad*2);
  c.setLineDash([]);
  const corners = [
    [localX - b.w/2 - pad, localY - b.h/2 - pad],
    [localX + b.w/2 + pad, localY - b.h/2 - pad],
    [localX - b.w/2 - pad, localY + b.h/2 + pad],
    [localX + b.w/2 + pad, localY + b.h/2 + pad]
  ];
  c.fillStyle = '#f2f5fa';
  c.strokeStyle = 'rgba(20,22,28,0.6)'; c.lineWidth = Math.max(1, cssToCanvasPx(1));
  for(let i = 0; i < 4; i++){
    c.beginPath(); c.rect(corners[i][0] - hs/2, corners[i][1] - hs/2, hs, hs); c.fill(); c.stroke();
  }
  const hy = localY - b.h/2 - pad - off;
  c.strokeStyle = 'rgba(233,236,242,0.8)'; c.lineWidth = lw;
  c.beginPath(); c.moveTo(localX, localY - b.h/2 - pad); c.lineTo(localX, hy); c.stroke();
  c.beginPath(); c.arc(localX, hy, hr, 0, Math.PI*2);
  c.fillStyle = '#f2f5fa'; c.fill();
  c.strokeStyle = 'rgba(20,22,28,0.6)'; c.lineWidth = Math.max(1, cssToCanvasPx(1)); c.stroke();
  c.save(); c.translate(localX, hy);
  const gs = hr * 0.78;
  c.strokeStyle = '#12151b'; c.lineWidth = Math.max(1, cssToCanvasPx(1.8)); c.lineCap = 'round';
  c.beginPath(); c.arc(0, 0, gs * 0.5, Math.PI * 0.35, Math.PI * 1.65); c.stroke();
  c.beginPath();
  c.moveTo(gs * 0.55, -gs * 0.35); c.lineTo(gs * 0.75, gs * 0.05); c.lineTo(gs * 0.3, 0);
  c.closePath(); c.fillStyle = '#12151b'; c.fill();
  c.restore();
  c.restore();
}

function drawCropUI(c, W, H){
  if(!state.crop.active) return;
  const cr = state.crop;
  if(cr.w <= 0 || cr.h <= 0) return;

  c.save();
  c.fillStyle = 'rgba(0,0,0,0.55)';
  c.beginPath();
  c.rect(0, 0, W, H);
  c.rect(cr.x, cr.y, cr.w, cr.h);
  c.fill('evenodd');
  c.restore();

  c.save();
  c.strokeStyle = 'rgba(255,255,255,0.95)';
  c.lineWidth = Math.max(1.5, W / 400);
  c.strokeRect(cr.x, cr.y, cr.w, cr.h);

  c.strokeStyle = 'rgba(255,255,255,0.35)';
  c.lineWidth = Math.max(1, W / 900);
  for(let i = 1; i <= 2; i++){
    c.beginPath();
    c.moveTo(cr.x + cr.w * i / 3, cr.y);
    c.lineTo(cr.x + cr.w * i / 3, cr.y + cr.h);
    c.stroke();
    c.beginPath();
    c.moveTo(cr.x, cr.y + cr.h * i / 3);
    c.lineTo(cr.x + cr.w, cr.y + cr.h * i / 3);
    c.stroke();
  }

  const hs = Math.max(14, W / 50);
  const corners = [
    [cr.x, cr.y], [cr.x + cr.w, cr.y],
    [cr.x, cr.y + cr.h], [cr.x + cr.w, cr.y + cr.h]

  for(let i = 0; i < 4; i++){
    c.beginPath();
    c.arc(corners[i][0], corners[i][1], hs / 2, 0, Math.PI * 2);
    c.fill(); c.stroke();
  }
  c.restore();
}

let curveDrag = null;
function bindCurveSVG(){
  const wrap = document.getElementById('curveCanvas');
  const svgEl = document.getElementById('curveSVG');
  if(!wrap || !svgEl) return;
  function svgToCurve(clientX, clientY){
    const r = svgEl.getBoundingClientRect();
    const x = clamp((clientX - r.left) / r.width, 0, 1);
    const y = clamp(1 - (clientY - r.top) / r.height, 0, 1);
    return { x, y };
  }
  function activePts(){
    const cd = currentCurves();
    const active = state.curves.active || 'rgb';
    if(!cd[active]) cd[active] = [{x:0,y:0},{x:1,y:1}];
    return cd[active];
  }
  function redrawCurve(){
    const pts = activePts();
    const ch = CURVE_CHANNELS.find(x => x.id === state.curves.active) || CURVE_CHANNELS[0];
    let pathD = 'M ' + (pts[0].x*100) + ' ' + (100 - pts[0].y*100);
    for(let i = 1; i < pts.length; i++) pathD += ' L ' + (pts[i].x*100) + ' ' + (100 - pts[i].y*100);
    document.getElementById('curvePath').setAttribute('d', pathD);
    document.getElementById('curvePath').setAttribute('stroke', ch.color);
    let circles = '';
    for(let i = 0; i < pts.length; i++){
      circles += '<circle data-cidx="' + i + '" cx="' + (pts[i].x*100) + '" cy="' + (100 - pts[i].y*100) + '" r="3.2" fill="#fff" stroke="#12151b" stroke-width="0.8" style="cursor:move"/>';
    }
    document.getElementById('curvePoints').innerHTML = circles;
  }
  function refreshRender(){
    const t = currentAdjustTarget();
    if(t.kind === 'layer') baseDirty = true;
    else invalidateBase();
    render();
  }
  function onDown(e){
    e.preventDefault();
    const p = svgToCurve(e.clientX, e.clientY);
    const pts = activePts();
    let closestIdx = -1, closestDist = Infinity;
    for(let i = 0; i < pts.length; i++){
      const d = Math.hypot(pts[i].x - p.x, pts[i].y - p.y);
      if(d < 0.05 && d < closestDist){ closestDist = d; closestIdx = i; }
    }
    if(closestIdx >= 0){
      const now = Date.now();
      if(curveDrag && curveDrag.lastTap === closestIdx && (now - curveDrag.lastTapTime) < 300 && closestIdx !== 0 && closestIdx !== pts.length - 1){
        pts.splice(closestIdx, 1);
        curveDrag = null;
        redrawCurve(); refreshRender();
        return;
      }
      curveDrag = { idx: closestIdx, lastTap: closestIdx, lastTapTime: now };
    } else {
      pts.push({ x: p.x, y: p.y });
      pts.sort((a,b) => a.x - b.x);
      for(let i = 0; i < pts.length; i++){
        if(pts[i].x === p.x && pts[i].y === p.y){ curveDrag = { idx: i }; break; }
      }
      redrawCurve(); refreshRender();
    }
    window.addEventListener('pointermove', onMove, { passive:false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }
  function onMove(e){
    if(!curveDrag) return;
    e.preventDefault();
    const p = svgToCurve(e.clientX, e.clientY);
    const pts = activePts();
    const idx = curveDrag.idx;
    if(idx < 0 || idx >= pts.length) return;
    if(idx === 0) pts[idx].x = 0;
    else if(idx === pts.length - 1) pts[idx].x = 1;
    else {
      const minX = pts[idx-1].x + 0.01;
      const maxX = pts[idx+1].x - 0.01;
      pts[idx].x = clamp(p.x, minX, maxX);
    }
    pts[idx].y = p.y;
    redrawCurve(); refreshRender();
  }
  function onUp(){
    curveDrag = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
  }
  wrap.addEventListener('pointerdown', onDown);
}

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function isImageFile(file){
  if(!file) return false;
  if(file.type && file.type.indexOf('image') === 0) return true;
  const n = (file.name || '').toLowerCase();
  return /\.(png|jpe?g|jpe|gif|webp|bmp|avif|heic|heif|svg|tiff?)$/.test(n);
}
function openPanel(){
  state.panelVisible = true;

  const ic = panelToggle.querySelector('svg');
  if(ic) ic.innerHTML = '<path d="M6 15l6-6 6 6"/>';

function handleImageUpload(file){
  if(!isImageFile(file)) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = function(){
    if(!state.image){
      const MAX = 1600;
      let w = img.naturalWidth, h = img.naturalHeight;
      const s = Math.min(1, MAX / Math.max(w, h));
      w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      state.image = c;
      state.history.length = 0; state.future.length = 0;
      state.layers = []; state.selected = -1; state.preset = 'none';
      state.adj = Object.assign({}, DEFAULT_ADJ);
      state.bg = { type:'none', color:'#111318', g:['#2b3040','#0e1015'] };
      state.crop.active = false;
      state.curves = Object.assign({ active:'rgb' }, defaultCurves());
      state.baseVisible = true;
      state.baseLocked = false;
      URL.revokeObjectURL(url);
      openPanel();
      exportBtn.disabled = false;
      updateUndoRedo();
      baseDirty = true;
      renderTabs(); renderPanel(); render();
      setTimeout(fitView, 40);
    } else {
      pushHistory();
      const o = {
        id: nextId(),
        name: 'Image ' + (state.layers.length + 1),
        type: 'image',
        src: url, img: img,
        x: 0.5, y: 0.5,
        size: 0.6,
        rotation: 0, opacity: 1, blend: 'normal',
        visible: true, locked: false,
        fitMode: 'fit',
        adj: Object.assign({}, DEFAULT_ADJ),
        preset: 'none',
        curves: defaultCurves(),
        maskStrokes: []
      };
      state.layers.push(o);
      state.selected = state.layers.length - 1;
      state.tab = 'layers';
      openPanel();
      baseDirty = true;
      renderTabs(); renderPanel(); render();
    }
  };
  img.onerror = function(){ URL.revokeObjectURL(url); };
  img.src = url;
}

fileInput.addEventListener('change', function(e){

let drag = null;
let activePointerId = null;

function pointerToCanvas(e){
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * canvas.width, y: (e.clientY - r.top) / r.height * canvas.height };
}
function pointerToNorm(e){
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
}
function hitLayer(p, W, H){
  const pad = cssToCanvasPx(22);
  for(let i = state.layers.length - 1; i >= 0; i--){
    const o = state.layers[i];
    if(!o.visible || o.locked) continue;
    const b = layerBounds(o, W, H);
    if(p.x >= b.x - pad && p.x <= b.x + b.w + pad && p.y >= b.y - pad && p.y <= b.y + b.h + pad) return i;
  }
  return -1;
}
function isOnRotateHandle(p, o, W, H){
  const b = layerBounds(o, W, H);
  const hp = rotateHandlePos(o, b, W, H);
  return Math.hypot(p.x - hp.x, p.y - hp.y) < cssToCanvasPx(30);
}

function startCropDragIfNeeded(p, W, H){
  if(state.tab !== 'crop') return false;
  if(!state.crop.active){
    state.crop.active = true;
    const pad = 0.1;
    state.crop.x = W * pad;
    state.crop.y = H * pad;
    state.crop.w = W * (1 - pad * 2);
    state.crop.h = H * (1 - pad * 2);
  }
  const c = state.crop;
  const hs = cssToCanvasPx(40);
  let mode = 'new';
  const corners = { nw:[c.x,c.y], ne:[c.x+c.w,c.y], sw:[c.x,c.y+c.h], se:[c.x+c.w,c.y+c.h] };
  const keys = ['nw','ne','sw','se'];
  for(let i = 0; i < keys.length; i++){
    const k = keys[i];
    if(Math.hypot(p.x - corners[k][0], p.y - corners[k][1]) < hs){ mode = k; break; }
  }
  if(mode === 'new' && p.x > c.x && p.x < c.x + c.w && p.y > c.y && p.y < c.y + c.h) mode = 'move';
  drag = { type:'crop', mode, start:p, orig:{ x:c.x, y:c.y, w:c.w, h:c.h } };
  return true;
}

function onPointerMove(e){
  if(!drag) return;
  if(activePointerId !== null && e.pointerId !== activePointerId) return;
  e.preventDefault();
  const p = pointerToCanvas(e);
  const W = canvas.width, H = canvas.height;

  if(drag.type === 'pan'){
    state.view.x = drag.vx + (e.clientX - drag.sx);
    state.view.y = drag.vy + (e.clientY - drag.sy);
    applyView();
    return;
  }
  if(drag.type === 'brush'){
    const layer = drag.target;
    if(!layer) return;
    const n = pointerToNorm(e);
    if(drag.isMask){
      const stroke = layer.maskStrokes[layer.maskStrokes.length - 1];
      stroke.pts.push({ x: n.x, y: n.y });
      baseDirty = true;
      requestRender();
    } else {
      const stroke = layer.strokes[layer.strokes.length - 1];
      stroke.pts.push({ x: n.x, y: n.y });
      requestRender();
    }
    return;
  }
  if(drag.type === 'resize'){
    const o = state.layers[drag.index];
    if(!o || o.locked) return;
    const cx = o.x * W, cy = o.y * H;
    const startDist = Math.hypot(drag.startP.x - cx, drag.startP.y - cy);
    const curDist = Math.hypot(p.x - cx, p.y - cy);
    if(startDist < 5) return;
    const ratio = curDist / startDist;
    const newSize = clamp(drag.startSize * ratio, 0.02, 4);
    o.size = newSize;
    if(o.type === 'image' || o.type === 'background') baseDirty = true;
    updateSizePanelOutput(o);

    else if(drag.mode === 'ne'){ ax = o.x; ay = o.y + o.h; }

    if(ar && ar[2]){

    }
    w = Math.max(20, Math.min(w, W)); h = Math.max(20, Math.min(h, H));

    let ny = py < ay ? ay - h : ay;
    nx = clamp(nx, 0, W - w);
    ny = clamp(ny, 0, H - h);

canvas.addEventListener('pointerdown', function(e){

  e.preventDefault();

  const W = canvas.width, H = canvas.height;
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}

    drag = { type:'pan', sx:e.clientX, sy:e.clientY, vx:state.view.x, vy:state.view.y };

    return;
  }

  if(state.tab === 'crop'){
    if(startCropDragIfNeeded(p, W, H)){ requestRender(); return; }
  }

  if(state.brush.active){
    const mode = BRUSH_MODES.find(m => m.id === state.brush.mode) || BRUSH_MODES[0];
    if(mode.id === 'erase'){
      let idx = state.selected;
      if(idx < 0 || (state.layers[idx].type !== 'image' && state.layers[idx].type !== 'background')){
        for(let i = state.layers.length - 1; i >= 0; i--){
          if(state.layers[i].type === 'image' || state.layers[i].type === 'background'){ idx = i; break; }
        }

      const target = state.layers[idx];

      if(!target.maskStrokes) target.maskStrokes = [];
      const n = pointerToNorm(e);
      target.maskStrokes.push({ size: state.brush.size / 500, opacity: state.brush.opacity, pts:[{x:n.x, y:n.y}] });

    else if(mode.id === 'shadow'){ blendMode = 'multiply'; color = '#202020'; }
    else if(mode.id === 'soften'){ blendMode = 'soft-light'; color = '#c8d0dd'; }

      id: nextId(), name: mode.label, type:'paint',

      strokes: [{ color: color, size: state.brush.size / 500, opacity: state.brush.opacity, blend: blendMode, pts:[{x:n.x, y:n.y}] }]
    };
    state.layers.push(o);
    state.selected = state.layers.length - 1;
    drag = { type:'brush', target: o, isMask: false };

  }

  const selIdx = state.selected;
  if(selIdx >= 0 && state.layers[selIdx]){
    const o = state.layers[selIdx];

      const corner = hitCorner(p, o, W, H);

      }

      }
    }

});

      size: (state.tab === 'text' ? 't-size' : 's-size'),
      spacing: 't-spacing', strokeWidth: 't-stroke', strokeW: 's-stroke',
      rotation: (state.tab === 'text' ? 't-rot' : 's-rot'),
      opacity: (state.tab === 'text' ? 't-opacity' : 's-opacity'),
      lineHeight: 't-lh'
    };
    const outId = outMap[key];
    if(outId){
      const out = panelBodyEl.querySelector('[data-out="' + outId + '"]');
      if(out){
        if(key === 'size') out.textContent = (state.tab === 'text') ? Math.round(o.size * 1000) / 10 : Math.round(o.size * 100);
        else if(key === 'opacity') out.textContent = Math.round(o.opacity * 100) + '%';
        else if(key === 'lineHeight') out.textContent = o.lineHeight.toFixed(2);
        else if(key === 'strokeW') out.textContent = (o.strokeW||0).toFixed(1);
        else out.textContent = el.value + suffix;
      }
    }
    if(o.type === 'image' || o.type === 'background') baseDirty = true;
    requestRender(); return;
  }
  if(el.matches('[data-brush]')){ state.brush[el.dataset.brush] = el.value; renderPanel(); return; }
  if(el.matches('[data-brush-range]')){
    const key = el.dataset.brushRange;
    const scale = el.dataset.scale ? parseFloat(el.dataset.scale) : 1;
    let v = parseFloat(el.value) * scale;
    state.brush[key] = v;
    const out = panelBodyEl.querySelector('[data-out="brush-' + key + '"]');
    if(out) out.textContent = key === 'opacity' ? Math.round(v*100) + '%' : v;
    const min = parseFloat(el.min), max = parseFloat(el.max);
    el.style.setProperty('--p', ((parseFloat(el.value) - min) / (max - min) * 100) + '%');
    return;
  }
  if(el.matches('[data-bgcolor]')){ state.bg.color = el.value; invalidateBase(); render(); return; }
});
panelBodyEl.addEventListener('change', function(e){
  const el = e.target;
  if(el.matches('[data-adj]') || el.matches('[data-prop-range]') || el.matches('[data-brush-range]')){ sliderActive = false; }
  if(el.matches('[data-prop-check]')){
    const o = state.layers[state.selected]; if(!o) return;
    pushHistory();
    o[el.dataset.propCheck] = el.checked; baseDirty = true; render();
  }
});
panelBodyEl.addEventListener('pointerup', function(){ sliderActive = false; });
panelBodyEl.addEventListener('pointercancel', function(){ sliderActive = false; });
panelBodyEl.addEventListener('click', function(e){
  if(e.target.matches('.layer-name')){
    e.stopPropagation();
    const i = parseInt(e.target.dataset.layername,10);
    if(!isNaN(i)){
      state.selected = i;
      const rows = panelBodyEl.querySelectorAll('.layer-row');
      for(let k = 0; k < rows.length; k++) rows[k].classList.remove('active');
      const row = e.target.closest('.layer-row');
      if(row) row.classList.add('active');
      render();
    }
  }
});

function addTextFromPreset(preset){
  if(!state.image) return;
  pushHistory();
  const o = {
    id: nextId(), name:preset.name, type:'text',
    text: preset.name.toUpperCase(),
    x:0.5, y:0.5, size:preset.size, font:preset.font, color:preset.color, color2:preset.color2 || preset.color,
    stroke:preset.stroke, shadow:preset.shadow, strokeWidth:preset.sw,
    effect:preset.effect, spacing:preset.sp, align:'center', lineHeight:1.16,
    rotation:0, opacity:1, bold:true, italic:false,
    visible:true, locked:false, blend:'normal'
  };
  state.layers.push(o);
  state.selected = state.layers.length - 1;
  state.tab = 'text';
  renderTabs(); renderPanel(); render();
}
function addTextLayer(){
  if(!state.image) return;
  pushHistory();
  const o = {
    id: nextId(), name:'Text', type:'text',
    text:'YOUR TEXT', x:0.5, y:0.5, size:0.13,
    font:'Anton', color:'#eef2f8', color2:'#8a94a6',
    stroke:'#0c0d10', shadow:'#000', strokeWidth:4,
    effect:'Chrome', spacing:2, align:'center', lineHeight:1.16,
    rotation:0, opacity:1, bold:true, italic:false,
    visible:true, locked:false, blend:'normal'
  };
  state.layers.push(o);
  state.selected = state.layers.length - 1;
  renderPanel(); render();
}
function addGraphic(index){
  if(!state.image) return;
  pushHistory();
  const g = GRAPHICS[index]; if(!g) return;
  const o = {
    id: nextId(), name:g[0], type:'graphic',
    d:g[1], size:0.25, color:'#eef2f8', strokeW:1.6, fill:false,
    x:0.5, y:0.5, rotation:0, opacity:1,
    visible:true, locked:false, blend:'normal'
  };
  state.layers.push(o);
  state.selected = state.layers.length - 1;
  state.tab = 'graphics';
  renderTabs(); renderPanel(); render();
}
function duplicateLayer(){
  const idx = state.selected;
  if(idx < 0 || !state.layers[idx]) return;
  pushHistory();
  const copy = JSON.parse(JSON.stringify(state.layers[idx]));
  delete copy.img;
  if(state.layers[idx].img) copy.img = state.layers[idx].img;
  copy.id = nextId();
  copy.x = clamp((copy.x || 0.5) + 0.05, 0, 1);
  copy.y = clamp((copy.y || 0.5) + 0.05, 0, 1);
  copy.name = (copy.name || 'Layer') + ' copy';
  state.layers.push(copy);
  state.selected = state.layers.length - 1;
  baseDirty = true;
  renderPanel(); render();
}
function deleteLayer(){
  const idx = state.selected;
  if(idx < 0) return;
  pushHistory();
  state.layers.splice(idx, 1);
  state.selected = -1;
  baseDirty = true;
  renderPanel(); render();
}
function rotateLayer(delta){
  const o = state.layers[state.selected]; if(!o) return;
  pushHistory();
  let r = (o.rotation || 0) + delta;
  r = ((r + 180) % 360 + 360) % 360 - 180;
  o.rotation = r;
  baseDirty = true;
  renderPanel(); render();
}
function resetLayerRotation(){
  const o = state.layers[state.selected]; if(!o) return;
  pushHistory();
  o.rotation = 0; baseDirty = true; renderPanel(); render();
}
function moveLayer(i, dir){
  if(i < 0 || i >= state.layers.length) return;
  const ni = i + dir;
  if(ni < 0 || ni >= state.layers.length) return;
  pushHistory();
  const t = state.layers[i]; state.layers[i] = state.layers[ni]; state.layers[ni] = t;
  state.selected = ni;
  baseDirty = true;
  renderPanel(); render();
}
function flattenVisible(){
  if(!state.image) return;
  pushHistory();
  render(true);
  const src = canvas.toDataURL('image/png');
  const img = new Image();
  img.onload = function(){
    const c = document.createElement('canvas');
    c.width = canvas.width; c.height = canvas.height;
    c.getContext('2d').drawImage(img, 0, 0);
    state.image = c;
    state.layers = [];
    state.selected = -1;
    state.preset = 'none';
    state.adj = Object.assign({}, DEFAULT_ADJ);
    state.bg = { type:'none', color:'#111318', g:['#2b3040','#0e1015'] };
    state.curves = Object.assign({ active:'rgb' }, defaultCurves());
    state.baseVisible = true;
    invalidateBase();
    renderPanel(); render();
  };
  img.src = src;
}
function rotateImage(){
  if(!state.image) return;
  pushHistory();
  const src = state.image;
  const c = document.createElement('canvas');
  c.width = src.height; c.height = src.width;
  const x = c.getContext('2d');
  x.translate(c.width/2, c.height/2); x.rotate(Math.PI/2);
  x.drawImage(src, -src.width/2, -src.height/2);
  state.image = c;
  state.crop.active = false;
  invalidateBase();
  renderPanel(); render();
}
function flipImage(horizontal){
  if(!state.image) return;
  pushHistory();
  const src = state.image;
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const x = c.getContext('2d');
  x.translate(horizontal ? c.width : 0, horizontal ? 0 : c.height);
  x.scale(horizontal ? -1 : 1, horizontal ? 1 : -1);
  x.drawImage(src, 0, 0);
  state.image = c;
  invalidateBase();
  render();
}
function applyCrop(){
  const c = state.crop;
  if(!state.image || !c.active || c.w < 4 || c.h < 4) return;
  pushHistory();

  render(true);

  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(c.w));
  out.height = Math.max(1, Math.round(c.h));
  out.getContext('2d').drawImage(
    canvas,
    Math.round(c.x), Math.round(c.y),
    out.width, out.height,
    0, 0,
    out.width, out.height
  );

  state.image = out;
  state.layers = [];
  state.selected = -1;
  state.preset = 'none';
  state.adj = Object.assign({}, DEFAULT_ADJ);
  state.bg = { type:'none', color:'#111318', g:['#2b3040','#0e1015'] };
  state.curves = Object.assign({ active:'rgb' }, defaultCurves());
  state.baseVisible = true;
  state.crop.active = false;
  baseDirty = true;
  renderPanel(); render();
  setTimeout(fitView, 40);
}
function applyAspectToCrop(){
  if(!state.crop.active || !state.image) return;
  const ar = ASPECTS.find(a => a[0] === state.crop.aspect);
  if(!ar || !ar[2]) return;
  const c = state.crop;
  const W = canvas.width, H = canvas.height;
  let w = c.w, h = c.h;
  if(w / h > ar[2]) w = h * ar[2]; else h = w / ar[2];
  if(w > W){ w = W; h = w / ar[2]; }
  if(h > H){ h = H; w = h * ar[2]; }
  c.w = w; c.h = h;
  c.x = clamp(c.x, 0, W - w);
  c.y = clamp(c.y, 0, H - h);
}
function exportImage(){
  if(!state.image) return;
  render(true);
  canvas.toBlob(function(blob){
    if(!blob) return;
    const a = document.createElement('a');
    const url = URL.createObjectURL(blob);
    a.href = url; a.download = 'editx-export.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  }, 'image/png');
  setTimeout(function(){ render(); }, 60);
}

stage.addEventListener('dragover', function(e){ e.preventDefault(); });
stage.addEventListener('drop', function(e){
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) handleImageUpload(f);
});
window.addEventListener('resize', function(){ requestRender(); });

document.addEventListener('keydown', function(e){
  const meta = e.ctrlKey || e.metaKey;
  if(meta && e.key.toLowerCase() === 'z'){
    e.preventDefault();
    if(e.shiftKey) redo(); else undo();
  } else if(meta && e.key.toLowerCase() === 'y'){
    e.preventDefault();
    redo();
  } else if(e.code === 'Space'){
    state.view.spacePressed = true;
  }
});
document.addEventListener('keyup', function(e){
  if(e.code === 'Space') state.view.spacePressed = false;
});

renderTabs();
renderPanel();
syncBrushUI();

if(document.fonts && document.fonts.load){
  const unique = Array.from(new Set(FONTS));
  unique.forEach(function(f){ document.fonts.load('700 60px "' + f + '"').catch(function(){}); });
}

})();
</script>
