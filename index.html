<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>EditX — Pro Photo Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Anton&family=Archivo+Black&family=Audiowide&family=Bebas+Neue&family=Bungee&family=Caveat:wght@700&family=Cinzel:wght@700&family=Dancing+Script:wght@700&family=Fredoka:wght@600&family=Great+Vibes&family=Kaushan+Script&family=Lobster&family=Monoton&family=Montserrat:wght@700;900&family=Orbitron:wght@700&family=Oswald:wght@500;700&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:ital,wght@1,700&family=Poppins:wght@700&family=Press+Start+2P&family=Righteous&family=Satisfy&family=Yellowtail&family=Bangers&family=Titan+One&family=Alfa+Slab+One&family=Abril+Fatface&family=DM+Serif+Display&family=Bodoni+Moda:opsz,wght@6..96,700&family=Cormorant+Garamond:wght@700&family=Libre+Baskerville:wght@700&family=Merriweather:wght@900&family=Lora:wght@700&family=Fraunces:opsz,wght@9..144,900&family=Space+Grotesk:wght@700&family=Outfit:wght@800&family=Plus+Jakarta+Sans:wght@800&family=Lexend:wght@700&family=Syne:wght@800&family=Unbounded:wght@800&family=Raleway:wght@800&family=Nunito:wght@900&family=Quicksand:wght@700&family=DM+Sans:wght@800&family=Manrope:wght@800&family=Sora:wght@800&family=Work+Sans:wght@800&family=Rubik:wght@800&family=Shadows+Into+Light&family=Rock+Salt&family=Special+Elite&family=Parisienne&family=Sacramento&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090c;--surface:#11131a;--surface-2:#181b24;--surface-3:#222733;--surface-4:#2b3140;
  --outline:#282e3a;--outline-2:#3a4150;--text:#eef1f7;--muted:#96a0b2;
  --silver:#c8d0dd;--silver-hi:#f4f6fb;--silver-lo:#8a94a6;
}
*,*::before,*::after{box-sizing:border-box}
html,body{max-width:100vw;overflow-x:hidden;margin:0;padding:0;height:100%}
[hidden]{display:none!important}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#08090c;color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
img,video,canvas{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* APPBAR — single line, compact, no overflow */
.appbar{
  display:flex;align-items:center;justify-content:space-between;gap:.35rem;
  padding:.5rem .6rem;flex-wrap:nowrap;overflow:hidden;
  border-bottom:1px solid var(--outline);
  background:linear-gradient(180deg,rgba(26,30,38,.96),rgba(11,13,17,.98));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  z-index:10;flex:none;
}
.brand{display:flex;align-items:center;gap:.4rem;min-width:0;flex-shrink:1}
.brand-mark{
  display:grid;place-items:center;flex:none;width:2.2rem;height:2.2rem;border-radius:.65rem;
  background:linear-gradient(150deg,#fff 0%,#d5dce8 35%,#8b95a6 100%);color:#0a0c10;
  box-shadow:0 .25rem .9rem rgba(190,205,230,.22),inset 0 1px 0 rgba(255,255,255,.8);
}
.brand-mark svg{width:1.15rem;height:1.15rem}
.brand-name{
  font-size:1.05rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap;
  background:linear-gradient(180deg,#fff 0%,#b8c2d0 60%,#8b95a6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  overflow:hidden;text-overflow:ellipsis;
}
.appbar-actions{display:flex;align-items:center;gap:.22rem;flex-shrink:0}

.icon-btn{
  display:grid;place-items:center;width:2.35rem;height:2.35rem;
  border:1px solid transparent;border-radius:999px;
  color:var(--muted);transition:.15s;flex:none;
}
.icon-btn svg{width:1.1rem;height:1.1rem}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--outline)}
.icon-btn:active{transform:scale(.95)}
.icon-btn:disabled{opacity:.3;pointer-events:none}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.35rem;
  min-height:2.35rem;padding:.4rem .85rem;border:1px solid transparent;border-radius:999px;
  background:var(--surface-2);color:var(--text);font-weight:600;font-size:.82rem;
  white-space:nowrap;transition:.15s;flex:none;
}
.btn svg{width:.95rem;height:.95rem;flex:none}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:scale(.97)}
.btn.filled{
  background:linear-gradient(180deg,#fff 0%,#e2e7f0 50%,#b9c3d2 100%);color:#0f1218;
  box-shadow:0 .25rem .9rem rgba(190,205,230,.22);border-color:rgba(255,255,255,.4);
}
.btn.tonal{background:var(--surface-3);border-color:var(--outline-2)}
.btn.full{width:100%}

/* STAGE */
.stage{
  position:relative;flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  padding:.65rem;overflow:hidden;
  background-color:#0b0d12;
  background-image:
    linear-gradient(45deg,#131620 25%,transparent 25%,transparent 75%,#131620 75%),
    linear-gradient(45deg,#131620 25%,transparent 25%,transparent 75%,#131620 75%);
  background-size:1.4rem 1.4rem;background-position:0 0,.7rem .7rem;
  touch-action:none;
}
#canvas{
  max-width:100%;max-height:100%;width:auto;height:auto;
  border-radius:.4rem;box-shadow:0 1rem 2.5rem rgba(0,0,0,.7);
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair;
  display:block;object-fit:contain;
}
.empty{
  position:absolute;inset:0;display:grid;place-items:center;gap:.9rem;text-align:center;
  padding:1.5rem;pointer-events:none;
}
.empty > *{pointer-events:auto}
.empty-icon{
  display:grid;place-items:center;width:4.6rem;height:4.6rem;border-radius:1.3rem;
  background:linear-gradient(150deg,#2a303c,#15181e);color:var(--silver);
  box-shadow:inset 0 0 0 1px var(--outline-2),0 .8rem 2rem rgba(0,0,0,.5);
}
.empty-icon svg{width:2rem;height:2rem}
.empty h3{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.empty p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.5;max-width:26ch}

/* PANEL */
.panel{
  display:flex;flex-direction:column;flex:none;
  max-height:56dvh;
  background:linear-gradient(180deg,rgba(21,24,31,.96),rgba(11,13,17,.99));
  border-top:1px solid var(--outline);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:max-height .25s cubic-bezier(.4,0,.2,1);
}
.panel.collapsed{max-height:0;overflow:hidden;border-top:0}
.tabs{
  display:flex;gap:.2rem;overflow-x:auto;overflow-y:hidden;
  padding:.5rem .6rem;border-bottom:1px solid var(--outline);
  scrollbar-width:none;background:rgba(8,9,12,.5);
  scroll-snap-type:x proximity;flex:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:.35rem;
  min-height:2.5rem;padding:.5rem .9rem;
  border:1px solid transparent;border-radius:999px;
  color:var(--muted);font-weight:600;font-size:.8rem;
  white-space:nowrap;flex:none;scroll-snap-align:start;
  transition:.15s;
}
.tab svg{width:1.05rem;height:1.05rem}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab.active{background:linear-gradient(180deg,#2e3546,#1c2029);color:var(--silver-hi);border-color:var(--outline-2)}
.panel-body{
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:1rem 1rem 1.4rem;display:flex;flex-direction:column;gap:1rem;
  min-height:0;scrollbar-width:thin;
}
.panel-body::-webkit-scrollbar{width:.4rem}
.panel-body::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:999px}

@media (min-width:64rem){
  .app{flex-direction:row;flex-wrap:wrap}
  .appbar{flex:0 0 100%;order:0}
  .stage{order:1;flex:1}
  .panel{order:2;flex:0 0 26rem;max-height:none;height:calc(100dvh - 3.35rem);border-top:0;border-left:1px solid var(--outline);transition:none}
  .panel.collapsed{max-height:none;flex:0 0 0;padding:0;border-left:0;overflow:hidden}
}

/* CONTENT */
.head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.head h3{margin:0;font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.head-sub{font-size:.76rem;color:var(--muted);font-weight:500}
.label{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:.1rem}
.hint{font-size:.82rem;color:var(--muted);line-height:1.6;margin:0}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--outline),transparent);border:0;margin:.3rem 0}

.field{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.field-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.field-row label{font-size:.86rem;color:var(--muted);font-weight:500}
.field-row output{
  font-size:.8rem;color:var(--silver);font-variant-numeric:tabular-nums;
  background:var(--surface-2);padding:.22rem .6rem;border-radius:999px;
  border:1px solid var(--outline);min-width:3.2rem;text-align:center;font-weight:600;
}

/* THICK SLIDER */
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:1.6rem;
  background:transparent;cursor:pointer;display:block;margin:0;touch-action:pan-y;
}
input[type=range]::-webkit-slider-runnable-track{
  height:.4rem;border-radius:999px;
  background:linear-gradient(to right,var(--silver-lo) 0%,var(--silver-lo) var(--p,50%),var(--surface-3) var(--p,50%),var(--surface-3) 100%);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:1.35rem;height:1.35rem;margin-top:-.475rem;border-radius:50%;
  background:linear-gradient(180deg,#fff,#c8d0dd);
  box-shadow:0 0 0 .22rem rgba(200,212,232,.16),0 2px 6px rgba(0,0,0,.5);
}
input[type=range]::-moz-range-track{height:.4rem;border-radius:999px;background:var(--surface-3)}
input[type=range]::-moz-range-thumb{width:1.35rem;height:1.35rem;border:none;border-radius:50%;background:linear-gradient(180deg,#fff,#c8d0dd)}
input[type=color]{width:100%;height:2.9rem;padding:.25rem;border-radius:.55rem;border:1px solid var(--outline);background:var(--surface-2);cursor:pointer}
input[type=text],textarea{
  width:100%;padding:.75rem .85rem;border-radius:.55rem;
  border:1px solid var(--outline);background:var(--surface-2);color:var(--text);
  font:inherit;min-width:0;resize:vertical;font-size:.9rem;
}
textarea{min-height:4rem;line-height:1.45}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--silver);outline-offset:2px}

.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{
  min-height:2.3rem;padding:.45rem .95rem;border-radius:999px;
  border:1px solid var(--outline);background:var(--surface-2);
  color:var(--muted);font-size:.8rem;font-weight:600;transition:.15s;
}
.chip:hover{color:var(--text);border-color:var(--outline-2);background:var(--surface-3)}
.chip:active{transform:scale(.96)}
.chip.active{background:linear-gradient(180deg,#fff,#c9d2e0);color:#0f1218;border-color:transparent;font-weight:700}

.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6rem,1fr));gap:.5rem}
.preset{
  display:flex;flex-direction:column;gap:.3rem;padding:.35rem;
  border:1px solid var(--outline);border-radius:.75rem;
  background:var(--surface-2);transition:.15s;
}
.preset:hover{background:var(--surface-3);transform:translateY(-1px)}
.preset:active{transform:scale(.97)}
.preset.active{border-color:var(--silver);box-shadow:0 0 0 2px var(--silver) inset}
.preset-avatar{
  position:relative;width:100%;aspect-ratio:1/1;border-radius:.55rem;
  overflow:hidden;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
}
.preset-avatar::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.35),transparent 60%);
  pointer-events:none;
}
.preset-avatar svg{
  width:1.35rem;height:1.35rem;color:rgba(255,255,255,.96);
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.55));position:relative;z-index:1;
}
.preset-avatar .badge4k{
  position:absolute;bottom:.2rem;right:.2rem;z-index:2;
  font-size:.5rem;font-weight:800;padding:.08rem .3rem;border-radius:.25rem;
  background:rgba(0,0,0,.65);color:#fff;letter-spacing:.06em;
  border:1px solid rgba(255,255,255,.35);
}
.preset span{font-size:.68rem;text-align:center;color:var(--muted);padding:.05rem .1rem .15rem;font-weight:600;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preset.active span{color:var(--silver-hi)}

.font-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr));gap:.45rem}
.font-chip{
  display:flex;flex-direction:column;gap:.15rem;align-items:center;
  min-height:4rem;padding:.6rem .4rem;
  border:1px solid var(--outline);border-radius:.75rem;
  background:var(--surface-2);transition:.15s;
}
.font-chip:hover{background:var(--surface-3);border-color:var(--outline-2)}
.font-chip.active{border-color:var(--silver);box-shadow:0 0 0 1px var(--silver) inset}
.font-chip .fc-sample{font-size:1.15rem;line-height:1;color:var(--text);font-weight:700}
.font-chip .fc-name{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

.graphics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.2rem,1fr));gap:.4rem}
.graphic-btn{
  display:grid;place-items:center;aspect-ratio:1/1;
  border:1px solid var(--outline);border-radius:.75rem;
  background:var(--surface-2);color:var(--silver);transition:.15s;
}
.graphic-btn svg{width:1.5rem;height:1.5rem}
.graphic-btn:hover{background:var(--surface-3);color:#fff;border-color:var(--outline-2);transform:translateY(-1px)}
.graphic-btn:active{transform:scale(.94)}

.layer-list{display:flex;flex-direction:column;gap:.4rem}
.layer-row{
  display:grid;grid-template-columns:auto 1fr auto;gap:.55rem;align-items:center;
  padding:.55rem .7rem;border:1px solid var(--outline);border-radius:.75rem;
  background:var(--surface-2);transition:.15s;cursor:pointer;
}
.layer-row:hover{background:var(--surface-3)}
.layer-row.active{border-color:var(--silver);box-shadow:0 0 0 1px var(--silver) inset;background:linear-gradient(180deg,#232a38,#181c25)}
.layer-row.locked{opacity:.6}
.layer-icon{
  display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:.55rem;
  background:var(--surface-3);color:var(--silver);flex:none;
}
.layer-icon svg{width:1.15rem;height:1.15rem}
.layer-name{
  font-size:.85rem;font-weight:600;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:transparent;border:0;padding:.25rem .4rem;border-radius:.35rem;width:100%;min-width:0;
}
.layer-name:focus{background:var(--surface);border:1px solid var(--outline-2);outline:none}
.layer-actions{display:flex;gap:.1rem;flex-wrap:nowrap}
.layer-btn{
  display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:.5rem;
  color:var(--muted);transition:.15s;
}
.layer-btn svg{width:1rem;height:1rem}
.layer-btn:hover{background:var(--surface);color:var(--text)}
.layer-btn.on{color:var(--silver-hi)}
.layer-btn.locked-on{color:#ffb347}

.upload-hero{
  display:flex;flex-direction:column;align-items:center;gap:.6rem;
  padding:1.3rem .9rem;border-radius:1rem;
  border:1px dashed var(--outline-2);
  background:linear-gradient(180deg,rgba(35,40,48,.5),rgba(23,26,33,.3));
  transition:.15s;text-align:center;
}
.upload-hero:hover{border-color:var(--silver);background:linear-gradient(180deg,rgba(45,52,63,.6),rgba(28,32,40,.4))}
.upload-hero-icon{
  display:grid;place-items:center;width:2.8rem;height:2.8rem;border-radius:.85rem;
  background:linear-gradient(150deg,#fff 0%,#d5dce8 35%,#8b95a6 100%);color:#0a0c10;
  box-shadow:0 .3rem .9rem rgba(190,205,230,.22),inset 0 1px 0 rgba(255,255,255,.8);
}
.upload-hero-icon svg{width:1.3rem;height:1.3rem}
.upload-hero-title{font-size:.9rem;font-weight:700}
.upload-hero-desc{font-size:.76rem;color:var(--muted);line-height:1.45;max-width:28ch}

.swatch-row{display:flex;flex-wrap:wrap;gap:.35rem}
.swatch{width:2.3rem;height:2.3rem;border-radius:.55rem;border:2px solid transparent;transition:.14s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.swatch:hover{transform:scale(1.08)}
.swatch.active{border-color:var(--silver-hi)}
.gradient-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(3rem,1fr));gap:.4rem}
.gradient{aspect-ratio:1/1;border-radius:.75rem;border:2px solid transparent;transition:.14s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.gradient:hover{transform:scale(1.05)}
.gradient.active{border-color:var(--silver-hi)}

.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr));gap:.5rem}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(4.5rem,1fr));gap:.45rem}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(3.5rem,1fr));gap:.4rem}
.tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;
  min-height:3.8rem;padding:.7rem .5rem;border-radius:.75rem;
  border:1px solid var(--outline);background:var(--surface-2);color:var(--muted);
  font-size:.74rem;font-weight:600;text-align:center;transition:.15s;
}
.tile svg{width:1.25rem;height:1.25rem}
.tile:hover{background:var(--surface-3);color:var(--text);border-color:var(--outline-2)}
.tile:active{transform:scale(.96)}

.blend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.4rem,1fr));gap:.4rem}
.blend-btn{
  min-height:2.4rem;padding:.5rem .4rem;border-radius:.55rem;
  border:1px solid var(--outline);background:var(--surface-2);
  color:var(--muted);font-size:.75rem;font-weight:600;transition:.15s;text-align:center;
}
.blend-btn:hover{color:var(--text);border-color:var(--outline-2);background:var(--surface-3)}
.blend-btn.active{background:linear-gradient(180deg,#fff,#c9d2e0);color:#0f1218;border-color:transparent;font-weight:700}

.switch{display:flex;align-items:center;gap:.6rem;font-size:.86rem;color:var(--muted);font-weight:500;cursor:pointer;min-height:2.6rem}
.switch input{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:2.5rem;height:1.4rem;border-radius:999px;background:var(--surface-3);cursor:pointer;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:.19rem;left:.19rem;width:1rem;height:1rem;border-radius:50%;background:var(--muted);transition:.2s}
.switch input:checked{background:linear-gradient(180deg,#fff,#c9d2e0)}
.switch input:checked::after{left:1.3rem;background:#0f1218}

@media (max-width:30rem){
  .brand-name{font-size:.98rem}
  .btn{padding:.4rem .7rem;font-size:.78rem}
  .btn.tonal span,.btn.filled span{display:none}
  .tab{padding:.45rem .75rem;font-size:.76rem}
}
</style>
</head>
<body>

<div class="app">
  <header class="appbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L20 4"/><path d="M14 4h6v6"/></svg>
      </span>
      <span class="brand-name">EditX</span>
    </div>
    <div class="appbar-actions">
      <button class="icon-btn" data-act="undo" title="Undo" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
      </button>
      <button class="icon-btn" data-act="redo" title="Redo" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg>
      </button>
      <button class="icon-btn" data-act="togglePanel" title="Toggle Tools" disabled id="panelToggle">

const SOLIDS = ['#000000','#ffffff','#111318','#1f2937','#374151','#7f1d1d','#9a3412','#854d0e','#14532d','#0f766e','#1e3a8a','#4c1d95','#831843','#e11d48','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#f1f5f9','#fbbf24','#a3e635','#f472b6','#38bdf8'];
const GRADIENTS = [
  ['#2b3040','#0e1015'],['#f8b195','#f67280'],['#c2e59c','#64b3f4'],['#fbc2eb','#a6c1ee'],
  ['#ffecd2','#fcb69f'],['#a1c4fd','#c2e9fb'],['#fdcbf1','#e6dee9'],['#f6d365','#fda085'],
  ['#84fab0','#8fd3f4'],['#cfd9df','#e2ebf0'],['#ff9a9e','#fecfef'],['#0f2027','#2c5364'],
  ['#ff6a3d','#c81e4f'],['#a8e063','#2d9e4f'],['#6fc3ff','#3d6bd9'],['#ffd93d','#e85d2f']
];
const BLEND_MODES = [
  ['normal','Normal'],['multiply','Multiply'],['screen','Screen'],['overlay','Overlay'],
  ['soft-light','Soft'],['hard-light','Hard'],['color-dodge','Dodge'],['color-burn','Burn'],
  ['difference','Diff'],['exclusion','Excl'],['lighten','Lighten'],['darken','Darken'],
  ['hue','Hue'],['saturation','Sat'],['color','Color'],['luminosity','Lum']

const ASPECTS = [
  ['free','Free',0],['1:1','1:1',1],['4:3','4:3',4/3],['3:4','3:4',3/4],
  ['16:9','16:9',16/9],['9:16','9:16',9/16],['3:2','3:2',3/2],['2:3','2:3',2/3],

];
const TABS = [
  ['presets','Presets','presets'],
  ['layers','Layers','layers'],
  ['adjust','Adjust','adjust'],
  ['text','Text','text'],
  ['graphics','Graphics','graphics'],
  ['images','Images','images'],

/* ============ DOM ============ */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const emptyEl = document.getElementById('empty');
const panelEl = document.getElementById('panel');
const tabsEl = document.getElementById('tabs');
const panelBodyEl = document.getElementById('panelBody');
const fileInput = document.getElementById('fileInput');
const overlayInput = document.getElementById('overlayInput');
const undoBtn = document.querySelector('[data-act="undo"]');
const redoBtn = document.querySelector('[data-act="redo"]');
const panelToggle = document.getElementById('panelToggle');
const exportBtn = document.querySelector('[data-act="export"]');

/* Base render cache — heavy pixel ops only run here */
const baseCache = document.createElement('canvas');
const bctx = baseCache.getContext('2d');
let baseDirty = true;
function invalidateBase(){ baseDirty = true; requestRender(); }

/* ============ STATE ============ */
const state = {
  image: null, preset: 'none',
  adj: { exposure:0, brightness:100, contrast:100, highlights:0, shadows:0, temperature:0, tint:0, vibrance:0, saturation:100, hue:0, sharpen:0, clarity:0, noiseRed:0, blur:0, vignette:0, grain:0, fade:0 },
  bg: { type:'none', color:'#111318', g:['#2b3040','#0e1015'] },
  subject: { active:false, shape:'rect', x:0, y:0, w:0, h:0, effect:'none', amount:20 },
  layers: [], selected: -1, tab: 'presets',
  crop: { x:0, y:0, w:0, h:0, active:false, aspect:'free' },
  history: [], future: [], panelVisible: false
};
let uid = 1;
function nextId(){ return 'L' + (uid++); }

/* ============ UTILS ============ */
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
function fitRect(iw, ih, W, H, pad){
  const mw = Math.max(1, W - pad*2), mh = Math.max(1, H - pad*2);
  const s = Math.min(mw/iw, mh/ih);
  return { x:(W-iw*s)/2, y:(H-ih*s)/2, w: iw*s, h: ih*s };
}
function rot(x,y,a){ return { x: x*Math.cos(a) - y*Math.sin(a), y: x*Math.sin(a) + y*Math.cos(a) }; }
function degToRad(d){ return d*Math.PI/180; }
function canvasScale(){ const r = canvas.getBoundingClientRect(); return (r.width / canvas.width) || 1; }
function cssToCanvasPx(p){ return p / canvasScale(); }

let noiseCanvas = null;
function getNoise(){
  if(noiseCanvas) return noiseCanvas;
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const d = x.createImageData(128,128);
  for(let i = 0; i < d.data.length; i += 4){
    const v = Math.random()*255;
    d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255;
  }
  x.putImageData(d,0,0); noiseCanvas = c; return c;
}
function canvasSize(){
  const img = state.image;
  if(!img) return { w:1, h:1 };
  if(state.bg.type !== 'none'){
    const base = Math.max(img.width, img.height);
    return { w: base, h: base };
  }
  return { w: img.width, h: img.height };
}

/* ============ HISTORY ============ */
function snapshot(){
  return JSON.stringify({
    preset: state.preset, adj: state.adj, bg: state.bg, subject: state.subject,
    layers: state.layers.map(o => { const c = Object.assign({}, o); delete c.img; return c; }),
    uid
  });
}
function pushHistory(){
  if(!state.image) return;
  state.history.push(snapshot());
  if(state.history.length > 40) state.history.shift();
  state.future.length = 0;
  updateUndoRedo();
}
function restoreSnapshot(s){
  const o = JSON.parse(s);
  state.preset = o.preset; state.adj = o.adj; state.bg = o.bg; state.subject = o.subject;
  state.layers = o.layers.map(ov => {
    if(ov.type === 'image' && ov.src){ const img = new Image(); img.src = ov.src; ov.img = img; }
    return ov;
  });
  uid = o.uid || uid;
  state.selected = -1; state.crop.active = false;
  invalidateBase();
  renderPanel(); render();
}
function undo(){ if(!state.history.length) return; state.future.push(snapshot()); restoreSnapshot(state.history.pop()); updateUndoRedo(); }
function redo(){ if(!state.future.length) return; state.history.push(snapshot()); restoreSnapshot(state.future.pop()); updateUndoRedo(); }
function updateUndoRedo(){
  undoBtn.disabled = !state.history.length;
  redoBtn.disabled = !state.future.length;
}

/* ============ RENDER ============ */
let rafId = null;
function requestRender(){ if(rafId) return; rafId = requestAnimationFrame(function(){ rafId = null; render(); }); }

function buildCSSFilter(){
  const a = state.adj; const parts = [];
  const p = PRESETS.find(f => f[0] === state.preset);
  if(p && p[2]) parts.push(p[2]);
  if(a.brightness !== 100) parts.push('brightness(' + a.brightness + '%)');
  if(a.contrast !== 100)   parts.push('contrast(' + a.contrast + '%)');
  if(a.saturation !== 100) parts.push('saturate(' + a.saturation + '%)');
  if(a.hue !== 0)          parts.push('hue-rotate(' + a.hue + 'deg)');
  if(a.blur > 0)           parts.push('blur(' + a.blur + 'px)');
  if(a.exposure !== 0)     parts.push('brightness(' + (100 + a.exposure) + '%)');
  return parts.length ? parts.join(' ') : 'none';
}

function applyPixelFx(c, w, h){
  const a = state.adj;
  const need = a.temperature !== 0 || a.tint !== 0 || a.vibrance !== 0 ||
               a.highlights !== 0 || a.shadows !== 0 || a.fade !== 0 ||
               a.sharpen > 0 || a.clarity > 0 || a.noiseRed > 0 || a.grain > 0;
  if(!need) return;
  const img = c.getImageData(0, 0, w, h);
  const d = img.data;
  const temp = a.temperature * 0.35;
  const tint = a.tint * 0.35;
  const vib = a.vibrance * 0.008;
  const hi = a.highlights * 0.4;
  const sh = a.shadows * 0.4;
  const fade = a.fade / 200;

  if(temp !== 0 || tint !== 0 || vib !== 0 || hi !== 0 || sh !== 0 || fade !== 0){
    for(let i = 0; i < d.length; i += 4){
      let r = d[i], g = d[i+1], b = d[i+2];
      if(temp !== 0){ r += temp; b -= temp; }
      if(tint !== 0){ g -= tint; r += tint * 0.5; b += tint * 0.5; }
      if(vib !== 0){
        const mx = r > g ? (r > b ? r : b) : (g > b ? g : b);
        const mn = r < g ? (r < b ? r : b) : (g < b ? g : b);
        const sat = mx > 0 ? (mx - mn) / mx : 0;
        const f = (1 - sat) * vib;
        const avg = (r + g + b) / 3;
        r += (r - avg) * f; g += (g - avg) * f; b += (b - avg) * f;
      }
      const l = (r + g + b) / 765;
      if(hi !== 0 && l > 0.5){ const f = (l - 0.5) * 2 * hi; r += f; g += f; b += f; }
      if(sh !== 0 && l < 0.5){ const f = (0.5 - l) * 2 * sh; r += f; g += f; b += f; }
      if(fade !== 0){ r += (255 - r) * fade; g += (255 - g) * fade; b += (255 - b) * fade; }
      d[i] = r < 0 ? 0 : r > 255 ? 255 : r;
      d[i+1] = g < 0 ? 0 : g > 255 ? 255 : g;
      d[i+2] = b < 0 ? 0 : b > 255 ? 255 : b;
    }
  }
  if(a.sharpen > 0){
    const amt = a.sharpen / 100 * 0.7;
    const src = new Uint8ClampedArray(d);
    const k = [0,-1,0,-1,5,-1,0,-1,0];
    for(let y = 0; y < h; y++){
      for(let x = 0; x < w; x++){
        const i = (y*w + x) * 4;
        let r = 0, g = 0, b = 0;
        for(let ky = -1; ky <= 1; ky++){
          const py = y + ky < 0 ? 0 : (y + ky >= h ? h-1 : y+ky);
          for(let kx = -1; kx <= 1; kx++){
            const px = x + kx < 0 ? 0 : (x + kx >= w ? w-1 : x+kx);
            const j = (py*w + px) * 4;
            const kv = k[(ky+1)*3 + (kx+1)];
            r += src[j] * kv; g += src[j+1] * kv; b += src[j+2] * kv;
          }
        }
        d[i]   = d[i]   * (1-amt) + r * amt;
        d[i+1] = d[i+1] * (1-amt) + g * amt;
        d[i+2] = d[i+2] * (1-amt) + b * amt;
      }
    }
  }
  if(a.noiseRed > 0){
    const wgt = Math.min(0.7, a.noiseRed / 100);
    const src = new Uint8ClampedArray(d);
    for(let y = 0; y < h; y++){
      for(let x = 0; x < w; x++){
        const i = (y*w + x) * 4;
        let r = 0, g = 0, b = 0, c = 0;
        for(let ky = -1; ky <= 1; ky++){
          const py = y + ky < 0 ? 0 : (y + ky >= h ? h-1 : y+ky);
          for(let kx = -1; kx <= 1; kx++){
            const px = x + kx < 0 ? 0 : (x + kx >= w ? w-1 : x+kx);
            const j = (py*w + px) * 4;
            r += src[j]; g += src[j+1]; b += src[j+2]; c++;
          }
        }
        d[i] = d[i] * (1-wgt) + (r/c) * wgt;
        d[i+1] = d[i+1] * (1-wgt) + (g/c) * wgt;
        d[i+2] = d[i+2] * (1-wgt) + (b/c) * wgt;
      }
    }
  }
  if(a.grain > 0){
    const amt = a.grain * 1.1;
    for(let i = 0; i < d.length; i += 4){
      const n = (Math.random() - .5) * amt;
      d[i] += n; d[i+1] += n; d[i+2] += n;
    }
  }
  c.putImageData(img, 0, 0);
}

/* Render base (image + bg + filters + pixel fx + subject effect) to cache */
function renderBase(W, H){
  if(baseCache.width !== W || baseCache.height !== H){
    baseCache.width = W; baseCache.height = H;
  }
  bctx.setTransform(1,0,0,1,0,0);
  bctx.clearRect(0,0,W,H);
  const img = state.image;
  if(!img) return;

  const bg = state.bg;
  let imgRect = { x:0, y:0, w:W, h:H };

  if(bg.type === 'blur'){
    bctx.save();
    bctx.filter = 'blur(30px) brightness(.82) saturate(1.2)';
    const s = Math.max(W / img.width, H / img.height) * 1.18;
    const bw = img.width * s, bh = img.height * s;
    bctx.drawImage(img, (W-bw)/2, (H-bh)/2, bw, bh);
    bctx.restore();
    bctx.fillStyle = 'rgba(0,0,0,0.14)'; bctx.fillRect(0,0,W,H);
    imgRect = fitRect(img.width, img.height, W, H, Math.min(W,H)*0.09);
  } else if(bg.type === 'solid'){
    bctx.fillStyle = bg.color; bctx.fillRect(0,0,W,H);
    imgRect = fitRect(img.width, img.height, W, H, Math.min(W,H)*0.07);
  } else if(bg.type === 'gradient'){
    const g = bctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0, bg.g[0]); g.addColorStop(1, bg.g[1]);
    bctx.fillStyle = g; bctx.fillRect(0,0,W,H);
    imgRect = fitRect(img.width, img.height, W, H, Math.min(W,H)*0.07);
  }

  bctx.save();
  bctx.filter = buildCSSFilter();
  bctx.imageSmoothingEnabled = true; bctx.imageSmoothingQuality = 'high';
  bctx.drawImage(img, imgRect.x, imgRect.y, imgRect.w, imgRect.h);
  bctx.restore();

  applyPixelFx(bctx, W, H);

  if(state.adj.vignette > 0){
    const g = bctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.76);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(0,0,0,' + (state.adj.vignette/100*0.86) + ')');
    bctx.fillStyle = g; bctx.fillRect(0,0,W,H);
  }

  applySubjectEffectOn(bctx, W, H);
}

function applySubjectEffectOn(c, W, H){
  const s = state.subject;
  if(!s.active || s.effect === 'none' || s.w < 2 || s.h < 2) return;
  const base = document.createElement('canvas');
  base.width = W; base.height = H;
  base.getContext('2d').drawImage(c.canvas, 0, 0);

  if(s.effect === 'onlyme'){
    c.clearRect(0, 0, W, H);
    c.save(); c.beginPath();
    if(s.shape === 'rect') c.rect(s.x, s.y, s.w, s.h);
    else c.ellipse(s.x + s.w/2, s.y + s.h/2, Math.abs(s.w)/2, Math.abs(s.h)/2, 0, 0, Math.PI*2);
    c.clip(); c.drawImage(base, 0, 0); c.restore();
    return;
  }

  const mod = document.createElement('canvas');
  mod.width = W; mod.height = H;
  const mctx = mod.getContext('2d');
  if(s.effect === 'blur'){ mctx.filter = 'blur(' + s.amount + 'px)'; mctx.drawImage(base, 0, 0); mctx.filter = 'none'; }
  else if(s.effect === 'desaturate'){ mctx.filter = 'saturate(0) brightness(1.02)'; mctx.drawImage(base, 0, 0); mctx.filter = 'none'; }
  else if(s.effect === 'darken'){ mctx.drawImage(base, 0, 0); mctx.fillStyle = 'rgba(0,0,0,' + (s.amount / 100) + ')'; mctx.fillRect(0, 0, W, H); }
  else if(s.effect === 'pixelate'){
    const px = Math.max(3, Math.round(s.amount));
    const sw = Math.max(1, Math.floor(W / px)), sh = Math.max(1, Math.floor(H / px));
    const small = document.createElement('canvas');
    small.width = sw; small.height = sh;
    small.getContext('2d').drawImage(base, 0, 0, sw, sh);
    mctx.imageSmoothingEnabled = false;
    mctx.drawImage(small, 0, 0, W, H);
  }

  c.clearRect(0, 0, W, H);
  c.drawImage(base, 0, 0);
  c.save(); c.beginPath(); c.rect(0, 0, W, H);
  if(s.shape === 'rect') c.rect(s.x, s.y, s.w, s.h);
  else c.ellipse(s.x + s.w/2, s.y + s.h/2, Math.abs(s.w)/2, Math.abs(s.h)/2, 0, 0, Math.PI*2);
  c.clip('evenodd'); c.drawImage(mod, 0, 0); c.restore();
}

function render(exportMode){
  const img = state.image;
  if(!img){ canvas.hidden = true; emptyEl.hidden = false; return; }
  canvas.hidden = false; emptyEl.hidden = true;

  const size = canvasSize();
  const W = Math.max(1, Math.round(size.w));
  const H = Math.max(1, Math.round(size.h));
  if(canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; baseDirty = true; }

  if(baseDirty){ renderBase(W, H); baseDirty = false; }

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(baseCache, 0, 0);

  for(let i = 0; i < state.layers.length; i++){
    const o = state.layers[i];
    if(!o.visible) continue;
    drawLayer(ctx, o, W, H);
  }

  if(!exportMode){
    drawSelectionUI(ctx, W, H);
    drawSubjectOverlay(ctx, W, H);
  }
}

function drawSubjectOverlay(c, W, H){
  const s = state.subject;
  if(!s.active || state.tab !== 'subject') return;
  const lw = cssToCanvasPx(2), dash = cssToCanvasPx(9);
  c.save(); c.strokeStyle = 'rgba(210,225,245,.95)'; c.lineWidth = lw;
  c.setLineDash([dash, dash*0.75]); c.beginPath();
  if(s.shape === 'rect') c.rect(s.x, s.y, s.w, s.h);
  else c.ellipse(s.x + s.w/2, s.y + s.h/2, Math.abs(s.w)/2, Math.abs(s.h)/2, 0, 0, Math.PI*2);
  c.stroke(); c.restore();
}

function fontString(o, size){
  const weight = o.bold ? '700' : '400';
  const style = o.italic ? 'italic ' : '';
  return style + weight + ' ' + size + 'px "' + o.font + '", sans-serif';
}

function drawTextLine(c, text, x, y, o, size){
  const effect = o.effect || 'Plain';
  c.save(); c.textAlign = o.align || 'center'; c.textBaseline = 'middle';
  if(effect === 'Neon'){
    c.fillStyle = o.color; c.shadowColor = o.color;
    for(let i = 0; i < 3; i++){ c.shadowBlur = size * (0.25 + i * 0.4); c.fillText(text, x, y); }
    c.shadowBlur = 0; c.fillStyle = '#ffffff'; c.fillText(text, x, y);
  } else if(effect === 'Shadow'){
    c.shadowColor = o.shadow || 'rgba(0,0,0,0.7)';
    c.shadowBlur = size * 0.28; c.shadowOffsetY = size * 0.09; c.shadowOffsetX = size * 0.04;
    c.fillStyle = o.color; c.fillText(text, x, y);
  } else if(effect === 'Outline'){
    c.lineJoin = 'round'; c.miterLimit = 2;
    c.strokeStyle = o.stroke || '#000';
    c.lineWidth = Math.max(1, (o.strokeWidth/100) * size);
    c.strokeText(text, x, y);
    c.fillStyle = o.color; c.fillText(text, x, y);
  } else if(effect === '3D'){
    const d = size * 0.045;
    c.fillStyle = o.shadow || '#000';
    for(let i = 4; i >= 1; i--) c.fillText(text, x + d*i*0.65, y + d*i);
    if(o.strokeWidth > 0 && o.stroke){
      c.lineJoin = 'round'; c.strokeStyle = o.stroke;
      c.lineWidth = Math.max(1, (o.strokeWidth/100) * size); c.strokeText(text, x, y);
    }
    c.fillStyle = o.color; c.fillText(text, x, y);
  } else {
    if(o.strokeWidth > 0 && o.stroke){
      c.lineJoin = 'round'; c.strokeStyle = o.stroke;
      c.lineWidth = Math.max(1, (o.strokeWidth/100) * size); c.strokeText(text, x, y);
    }
    c.fillStyle = o.color; c.fillText(text, x, y);
  }
  c.restore();
}

function drawLayer(c, o, W, H){
  c.save();
  c.globalAlpha = (o.opacity === undefined ? 1 : o.opacity);
  if(o.blend && o.blend !== 'normal') c.globalCompositeOperation = o.blend;
  c.translate(o.x * W, o.y * H);
  c.rotate(degToRad(o.rotation || 0));

  if(o.type === 'text'){
    const size = o.size * H;
    c.font = fontString(o, size);
    if('letterSpacing' in c) c.letterSpacing = ((o.spacing || 0) * size / 100) + 'px';
    const lines = String(o.text).split('\n');
    const lineH = size * (o.lineHeight || 1.16);
    const startY = -((lines.length - 1) * lineH) / 2;
    for(let i = 0; i < lines.length; i++){
      const line = o.uppercase ? lines[i].toUpperCase() : (o.lowercase ? lines[i].toLowerCase() : lines[i]);
      drawTextLine(c, line, 0, startY + i*lineH, o, size);
    }
    if('letterSpacing' in c) c.letterSpacing = '0px';
  } else if(o.type === 'graphic'){
    const s = o.size * Math.min(W, H);
    const p = new Path2D(o.d);
    c.save();
    c.translate(-s/2, -s/2);
    c.scale(s/24, s/24);
    // SVG-like rendering: fill only when explicitly enabled, stroke like SVG stroke-width
    if(o.fill){ c.fillStyle = o.color; c.fill(p); }
    if(o.strokeW > 0){
      c.strokeStyle = o.color;              // Use same color as SVG preview (currentColor)
      c.lineWidth = o.strokeW;              // strokeW in SVG-unit space (scales with size)
      c.lineJoin = 'round';
      c.lineCap = 'round';
      c.stroke(p);
    }
    c.restore();
  } else if(o.type === 'image' && o.img){
    const s = o.size * Math.min(W, H);
    const aspect = o.img.width / o.img.height;
    const dw = aspect >= 1 ? s : s * aspect;
    const dh = aspect >= 1 ? s / aspect : s;
    c.drawImage(o.img, -dw/2, -dh/2, dw, dh);
  }
  c.restore();
}

function layerBounds(o, W, H){
  if(o.type === 'text'){
    const size = o.size * H;
    ctx.save(); ctx.font = fontString(o, size);
    const lines = String(o.text).split('\n');
    let maxW = 1;
    for(let i = 0; i < lines.length; i++) maxW = Math.max(maxW, ctx.measureText(lines[i]).width);
    ctx.restore();
    const h = lines.length * size * (o.lineHeight || 1.16);
    return { x: o.x*W - maxW/2, y: o.y*H - h/2, w: maxW, h };
  }
  const s = o.size * Math.min(W, H);
  if(o.type === 'image' && o.img){
    const aspect = o.img.width / o.img.height;
    const dw = aspect >= 1 ? s : s * aspect;
    const dh = aspect >= 1 ? s / aspect : s;
    return { x: o.x*W - dw/2, y: o.y*H - dh/2, w: dw, h: dh };
  }
  return { x: o.x*W - s/2, y: o.y*H - s/2, w: s, h: s };
}

function rotateHandlePos(o, b, W, H){
  const pad = cssToCanvasPx(8), off = cssToCanvasPx(46);
  const ly = -b.h/2 - pad - off;
  const r = rot(0, ly, degToRad(o.rotation || 0));
  return { x: o.x*W + r.x, y: o.y*H + r.y };
}

function drawSelectionUI(c, W, H){
  const idx = state.selected;
  if(idx < 0 || !state.layers[idx]) return;
  const o = state.layers[idx];
  if(!o.visible || o.locked) return;
  const b = layerBounds(o, W, H);
  const pad = cssToCanvasPx(8), lw = cssToCanvasPx(2), hs = cssToCanvasPx(15), hr = cssToCanvasPx(12);
  const off = cssToCanvasPx(46), dl = cssToCanvasPx(8), dg = cssToCanvasPx(6);

  c.save();
  c.translate(o.x * W, o.y * H);
  c.rotate(degToRad(o.rotation || 0));

  c.strokeStyle = 'rgba(233,236,242,0.95)'; c.lineWidth = lw;
  c.setLineDash([dl, dg]);
  c.strokeRect(-b.w/2 - pad, -b.h/2 - pad, b.w + pad*2, b.h + pad*2);
  c.setLineDash([]);

  const corners = [
    [-b.w/2 - pad, -b.h/2 - pad], [ b.w/2 + pad, -b.h/2 - pad],
    [-b.w/2 - pad,  b.h/2 + pad], [ b.w/2 + pad,  b.h/2 + pad]
  ];
  c.fillStyle = '#f2f5fa';
  c.strokeStyle = 'rgba(20,22,28,0.6)';
  c.lineWidth = Math.max(1, cssToCanvasPx(1));
  for(let i = 0; i < corners.length; i++){
    c.beginPath();
    c.rect(corners[i][0] - hs/2, corners[i][1] - hs/2, hs, hs);
    c.fill(); c.stroke();
  }

  const hy = -b.h/2 - pad - off;
  c.strokeStyle = 'rgba(233,236,242,0.8)'; c.lineWidth = lw;
  c.beginPath(); c.moveTo(0, -b.h/2 - pad); c.lineTo(0, hy); c.stroke();

  c.beginPath(); c.arc(0, hy, hr, 0, Math.PI*2);
  c.fillStyle = '#f2f5fa'; c.fill();
  c.strokeStyle = 'rgba(20,22,28,0.6)';
  c.lineWidth = Math.max(1, cssToCanvasPx(1)); c.stroke();

  c.save(); c.translate(0, hy);
  const gs = hr * 0.78;
  c.strokeStyle = '#12151b'; c.lineWidth = Math.max(1, cssToCanvasPx(1.8)); c.lineCap = 'round';
  c.beginPath(); c.arc(0, 0, gs * 0.5, Math.PI * 0.35, Math.PI * 1.65); c.stroke();
  c.beginPath();
  c.moveTo(gs * 0.55, -gs * 0.35); c.lineTo(gs * 0.75, gs * 0.05); c.lineTo(gs * 0.3, 0);
  c.closePath(); c.fillStyle = '#12151b'; c.fill();
  c.restore();
  c.restore();
}

    '<div class="field"><div class="field-row"><label>Opacity</label><output data-out="s-opacity">' + Math.round((o.opacity===undefined?1:o.opacity)*100) + '%</output></div>' +
      '<input type="range" data-prop-range="opacity" data-scale="0.01" data-suffix="%" min="5" max="100" step="1" value="' + Math.round((o.opacity===undefined?1:o.opacity)*100) + '" style="--p:' + (Math.round((o.opacity===undefined?1:o.opacity)*100)-5)/95*100 + '%"></div>';
  } else {
    html += '<p class="hint">Upload a PNG with transparency, logo, watermark or photo.</p>';
  }
  return html;
}

function panelBg(){
  const bg = state.bg;
  const modes = [['none','Original'],['blur','Blur'],['solid','Solid'],['gradient','Gradient']];
  let modeChips = '';
  for(let i = 0; i < modes.length; i++){

    '<p class="hint">Square composition with styled background.</p>' +

    let sw = '';
    for(let i = 0; i < SOLIDS.length; i++){

      '<div class="field"><label>Custom Color</label><input type="color" data-bgcolor value="' + bg.color + '"></div>';
  } else if(bg.type === 'gradient'){
    let gr = '';

/* ============ LOAD IMAGE ============ */
function loadImageFile(file){
  if(!file || !file.type || file.type.indexOf('image') !== 0) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = function(){
    const MAX = 1600;
    let w = img.naturalWidth, h = img.naturalHeight;
    const s = Math.min(1, MAX / Math.max(w, h));
    w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    state.image = c;
    state.history.length = 0; state.future.length = 0;
    state.layers = []; state.selected = -1; state.preset = 'none';
    state.adj = { exposure:0, brightness:100, contrast:100, highlights:0, shadows:0, temperature:0, tint:0, vibrance:0, saturation:100, hue:0, sharpen:0, clarity:0, noiseRed:0, blur:0, vignette:0, grain:0, fade:0 };
    state.bg = { type:'none', color:'#111318', g:['#2b3040','#0e1015'] };
    state.subject = { active:false, shape:'rect', x:0, y:0, w:0, h:0, effect:'none', amount:20 };
    state.crop.active = false;
    URL.revokeObjectURL(url);
    state.panelVisible = true;
    panelEl.classList.remove('collapsed');
    panelToggle.disabled = false;
    exportBtn.disabled = false;
    updateUndoRedo();
    baseDirty = true;
    renderTabs(); renderPanel(); render();
  };
  img.onerror = function(){ URL.revokeObjectURL(url); };
  img.src = url;
}

/* ============ POINTER ============ */
let drag = null;
let activePointerId = null;

function pointerToCanvas(e){
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * canvas.width, y: (e.clientY - r.top) / r.height * canvas.height };
}

function hitLayer(p, W, H){
  const pad = cssToCanvasPx(22);
  for(let i = state.layers.length - 1; i >= 0; i--){
    const o = state.layers[i];
    if(!o.visible || o.locked) continue;
    const b = layerBounds(o, W, H);
    if(p.x >= b.x - pad && p.x <= b.x + b.w + pad && p.y >= b.y - pad && p.y <= b.y + b.h + pad) return i;
  }
  return -1;
}

function isOnRotateHandle(p, o, W, H){
  const b = layerBounds(o, W, H);
  const hp = rotateHandlePos(o, b, W, H);
  return Math.hypot(p.x - hp.x, p.y - hp.y) < cssToCanvasPx(30);
}

function onPointerMove(e){
  if(!drag) return;
  if(activePointerId !== null && e.pointerId !== activePointerId) return;
  e.preventDefault();
  const p = pointerToCanvas(e);
  const W = canvas.width, H = canvas.height;

  if(drag.type === 'crop'){
    const c = state.crop; const o = drag.orig;
    if(drag.mode === 'move'){
      c.x = clamp(o.x + (p.x - drag.start.x), 0, W - o.w);
      c.y = clamp(o.y + (p.y - drag.start.y), 0, H - o.h);
      c.w = o.w; c.h = o.h;
      requestRender(); return;
    }
    let ax, ay;
    if(drag.mode === 'new'){ ax = drag.start.x; ay = drag.start.y; }
    else if(drag.mode === 'nw'){ ax = o.x + o.w; ay = o.y + o.h; }
    else if(drag.mode === 'ne'){ ax = o.x; ay = o.y + o.h; }
    else if(drag.mode === 'sw'){ ax = o.x + o.w; ay = o.y; }
    else { ax = o.x; ay = o.y; }
    const px = clamp(p.x, 0, W), py = clamp(p.y, 0, H);
    let w = Math.abs(px - ax), h = Math.abs(py - ay);
    w = Math.min(w, px < ax ? ax : W - ax);
    h = Math.min(h, py < ay ? ay : H - ay);
    const ar = ASPECTS.find(a => a[0] === state.crop.aspect);
    if(ar && ar[2]){ if(w / (h || 1) > ar[2]) w = h * ar[2]; else h = w / ar[2]; }
    w = Math.max(20, w); h = Math.max(20, h);
    c.x = px < ax ? ax - w : ax;
    c.y = py < ay ? ay - h : ay;
    c.w = w; c.h = h;
    requestRender(); return;
  }

  if(drag.type === 'subject'){
    const s = state.subject;
    const start = drag.start;
    const x = clamp(Math.min(start.x, p.x), 0, W);
    const y = clamp(Math.min(start.y, p.y), 0, H);
    const w = clamp(Math.abs(p.x - start.x), 0, W - x);
    const h = clamp(Math.abs(p.y - start.y), 0, H - y);
    s.x = x; s.y = y; s.w = w; s.h = h;
    s.active = true;
    requestRender(); return;
  }

  if(drag.type === 'layer'){
    const o = state.layers[drag.index];
    if(!o || o.locked) return;
    o.x = clamp(drag.ox + (p.x - drag.start.x) / W, -0.2, 1.2);
    o.y = clamp(drag.oy + (p.y - drag.start.y) / H, -0.2, 1.2);
    requestRender(); return;
  }

  if(drag.type === 'rotate'){
    const o = state.layers[drag.index];
    if(!o || o.locked) return;
    const cx = o.x * W, cy = o.y * H;
    const angle = Math.atan2(p.y - cy, p.x - cx);
    let deg = drag.startRotation + (angle - drag.startAngle) * 180 / Math.PI;
    const snapped = Math.round(deg / 15) * 15;
    if(Math.abs(deg - snapped) < 3.5) deg = snapped;
    deg = ((deg + 180) % 360 + 360) % 360 - 180;
    o.rotation = Math.round(deg);
    const outId = o.type === 'text' ? 't-rot' : 's-rot';
    const out = panelBodyEl.querySelector('[data-out="' + outId + '"]');
    if(out) out.textContent = o.rotation + 'deg';
    const rng = panelBodyEl.querySelector('input[data-prop-range="rotation"]');
    if(rng){ rng.value = o.rotation; rng.style.setProperty('--p', ((o.rotation + 180) / 360 * 100) + '%'); }
    requestRender();
  }
}

function onPointerUp(e){
  if(activePointerId !== null && e.pointerId !== activePointerId) return;
  drag = null; activePointerId = null;
  canvas.style.cursor = 'crosshair';
  requestRender();
}

canvas.addEventListener('pointerdown', function(e){
  if(!state.image) return;
  if(activePointerId !== null) return;
  e.preventDefault();
  activePointerId = e.pointerId;
  const p = pointerToCanvas(e);
  const W = canvas.width, H = canvas.height;
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  canvas.addEventListener('pointermove', onPointerMove, { passive:false });
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);

  if(state.tab === 'crop'){
    if(!state.crop.active){
      state.crop.active = true;
      state.crop.x = 0; state.crop.y = 0;
      state.crop.w = W; state.crop.h = H;
    }
    const c = state.crop;
    const hs = cssToCanvasPx(30);
    let mode = 'new';
    const corners = { nw:[c.x, c.y], ne:[c.x + c.w, c.y], sw:[c.x, c.y + c.h], se:[c.x + c.w, c.y + c.h] };
    const keys = ['nw','ne','sw','se'];
    for(let i = 0; i < keys.length; i++){
      const k = keys[i];
      if(Math.abs(p.x - corners[k][0]) < hs && Math.abs(p.y - corners[k][1]) < hs){ mode = k; break; }
    }
    if(mode === 'new' && p.x > c.x && p.x < c.x + c.w && p.y > c.y && p.y < c.y + c.h) mode = 'move';
    drag = { type:'crop', mode, start:p, orig:{ x:c.x, y:c.y, w:c.w, h:c.h } };
    requestRender(); return;
  }

  if(state.tab === 'subject'){
    drag = { type:'subject', start:p };
    state.subject.active = true;
    state.subject.x = p.x; state.subject.y = p.y;
    state.subject.w = 0; state.subject.h = 0;
    requestRender(); return;
  }

  if(state.selected >= 0 && state.layers[state.selected]){
    const o = state.layers[state.selected];
    if(o && !o.locked && isOnRotateHandle(p, o, W, H)){
      const cx = o.x * W, cy = o.y * H;
      drag = { type:'rotate', index: state.selected,
        startAngle: Math.atan2(p.y - cy, p.x - cx), startRotation: o.rotation || 0 };
      canvas.style.cursor = 'grabbing';
      return;
    }
  }

  const idx = hitLayer(p, W, H);
  if(idx !== state.selected){ state.selected = idx; renderPanel(); }
  if(idx >= 0){
    const o = state.layers[idx];
    if(!o.locked){
      drag = { type:'layer', index:idx, start:p, ox:o.x, oy:o.y };
      canvas.style.cursor = 'grabbing';
    }
  }
  requestRender();
});

/* ============ LAYER HELPERS ============ */
function createLayer(opts){
  const o = Object.assign({
    id: nextId(), name: '', type: 'text',
    visible: true, locked: false, opacity: 1, blend: 'normal',
    rotation: 0, x: 0.5, y: 0.5
  }, opts);
  if(!o.name){
    if(o.type === 'text') o.name = 'Text';
    else if(o.type === 'graphic') o.name = 'Shape';
    else if(o.type === 'image') o.name = 'Image';
  }
  return o;
}

function addTextFromPreset(preset){
  if(!state.image) return;
  pushHistory();
  const o = createLayer({
    type:'text', name:preset.name, text:preset.name.toUpperCase(),
    size:preset.size, font:preset.font, color:preset.color,
    stroke:preset.stroke, shadow:preset.shadow, strokeWidth:preset.sw,
    effect:preset.effect, spacing:preset.sp, align:'center', lineHeight:1.16,
    bold:true, italic:false
  });
  state.layers.push(o);
  state.selected = state.layers.length - 1;
  state.tab = 'text';
  renderTabs(); renderPanel(); render();
}

function addTextLayer(){
  if(!state.image) return;
  pushHistory();
  const o = createLayer({
    type:'text', name:'Text', text:'YOUR TEXT',
    size:0.12, font:'Anton', color:'#eef2f8', stroke:'#1a1e26', shadow:'#0b0d12',
    strokeWidth:4, effect:'3D', spacing:2, align:'center', lineHeight:1.16,
    bold:true, italic:false
  });
  state.layers.push(o);
  state.selected = state.layers.length - 1;
  renderPanel(); render();
}

/* KEY FIX: graphics added as outline by default — same look as preview */
function addGraphic(index){
  if(!state.image) return;
  pushHistory();
  const g = GRAPHICS[index]; if(!g) return;
  const o = createLayer({
    type:'graphic', name:g[0], id:g[0], d:g[1], size:0.25,
    color:'#eef2f8',     // white outline (matches preview stroke look)
    strokeW: 1.6,        // SVG-unit stroke (scales with size)
    fill: false          // outline only by default — same as preview
  });
  state.layers.push(o);
  state.selected = state.layers.length - 1;
  state.tab = 'graphics';
  renderTabs(); renderPanel(); render();
}

function duplicateLayer(){
  const idx = state.selected;
  if(idx < 0 || !state.layers[idx]) return;
  pushHistory();
  const copy = JSON.parse(JSON.stringify(state.layers[idx]));
  delete copy.img;
  if(state.layers[idx].img) copy.img = state.layers[idx].img;
  copy.id = nextId();
  copy.x = clamp(copy.x + 0.05, 0, 1);
  copy.y = clamp(copy.y + 0.05, 0, 1);
  copy.name = (copy.name || 'Layer') + ' copy';
  state.layers.push(copy);
  state.selected = state.layers.length - 1;
  renderPanel(); render();
}

function deleteLayer(){
  const idx = state.selected;
  if(idx < 0) return;
  pushHistory();
  state.layers.splice(idx, 1);
  state.selected = -1;
  renderPanel(); render();
}

function rotateLayer(delta){
  const o = state.layers[state.selected]; if(!o) return;
  pushHistory();
  let r = (o.rotation || 0) + delta;
  r = ((r + 180) % 360 + 360) % 360 - 180;
  o.rotation = r;
  renderPanel(); render();
}

function resetLayerRotation(){
  const o = state.layers[state.selected]; if(!o) return;
  pushHistory();
  o.rotation = 0; renderPanel(); render();
}

function moveLayer(i, dir){
  if(i < 0 || i >= state.layers.length) return;
  const ni = i + dir;
  if(ni < 0 || ni >= state.layers.length) return;
  pushHistory();
  const t = state.layers[i];
  state.layers[i] = state.layers[ni];
  state.layers[ni] = t;
  state.selected = ni;
  renderPanel(); render();
}

function flattenVisible(){
  if(!state.image) return;
  pushHistory();
  render(true);
  const src = canvas.toDataURL('image/png');
  const img = new Image();
  img.onload = function(){
    const c = document.createElement('canvas');
    c.width = canvas.width; c.height = canvas.height;
    c.getContext('2d').drawImage(img, 0, 0);
    state.image = c;
    state.layers = [];
    state.selected = -1;
    state.preset = 'none';
    state.adj = { exposure:0, brightness:100, contrast:100, highlights:0, shadows:0, temperature:0, tint:0, vibrance:0, saturation:100, hue:0, sharpen:0, clarity:0, noiseRed:0, blur:0, vignette:0, grain:0, fade:0 };
    state.bg = { type:'none', color:'#111318', g:['#2b3040','#0e1015'] };
    state.subject = { active:false, shape:'rect', x:0, y:0, w:0, h:0, effect:'none', amount:20 };
    invalidateBase();
    renderPanel(); render();
  };
  img.src = src;
}

function rotateImage(){
  if(!state.image) return;
  pushHistory();
  const src = state.image;
  const c = document.createElement('canvas');
  c.width = src.height; c.height = src.width;
  const x = c.getContext('2d');
  x.translate(c.width/2, c.height/2); x.rotate(Math.PI/2);
  x.drawImage(src, -src.width/2, -src.height/2);
  state.image = c;
  state.crop.active = false;
  invalidateBase();
  renderPanel(); render();
}

function flipImage(horizontal){
  if(!state.image) return;
  pushHistory();
  const src = state.image;
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const x = c.getContext('2d');
  x.translate(horizontal ? c.width : 0, horizontal ? 0 : c.height);
  x.scale(horizontal ? -1 : 1, horizontal ? 1 : -1);
  x.drawImage(src, 0, 0);
  state.image = c;
  invalidateBase();
  render();
}

function applyCrop(){
  const c = state.crop;
  if(!state.image || !c.active || c.w < 4 || c.h < 4) return;
  pushHistory();
  const src = state.image;
  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(c.w));
  out.height = Math.max(1, Math.round(c.h));
  out.getContext('2d').drawImage(src, Math.round(c.x), Math.round(c.y), out.width, out.height, 0, 0, out.width, out.height);
  state.image = out;
  state.crop.active = false; state.selected = -1;
  invalidateBase();
  renderPanel(); render();
}

function applyAspectToCrop(){
  if(!state.crop.active || !state.image) return;
  const ar = ASPECTS.find(a => a[0] === state.crop.aspect);
  if(!ar || !ar[2]) return;
  const c = state.crop;
  const W = canvas.width, H = canvas.height;
  let w = c.w, h = c.h;
  if(w / h > ar[2]) w = h * ar[2]; else h = w / ar[2];
  w = Math.min(w, W); h = Math.min(h, H);
  c.w = w; c.h = h;
  c.x = clamp(c.x, 0, W - w);
  c.y = clamp(c.y, 0, H - h);
}

function exportImage(){
  if(!state.image) return;
  render(true);
  canvas.toBlob(function(blob){
    if(!blob) return;
    const a = document.createElement('a');
    const url = URL.createObjectURL(blob);
    a.href = url; a.download = 'editx-export.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  }, 'image/png');
  setTimeout(function(){ render(); }, 60);
}

/* ============ EVENTS ============ */
document.addEventListener('click', function(e){
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){
    state.tab = tabBtn.dataset.tab;
    if(state.tab === 'crop' && state.image && !state.crop.active){
      state.crop.active = true; state.crop.x = 0; state.crop.y = 0;
      state.crop.w = canvas.width; state.crop.h = canvas.height;
    }
    renderTabs(); renderPanel(); requestRender(); return;
  }
  const presetBtn = e.target.closest('[data-preset]');
  if(presetBtn){
    if(state.preset !== presetBtn.dataset.preset) pushHistory();
    state.preset = presetBtn.dataset.preset;
    invalidateBase();
    renderPanel(); render(); return;
  }
  const fontBtn = e.target.closest('[data-font]');
  if(fontBtn){
    const o = state.layers[state.selected];
    if(o && o.type === 'text'){
      o.font = fontBtn.dataset.font;
      if(document.fonts && document.fonts.load){
        document.fonts.load('700 60px "' + o.font + '"').then(function(){ requestRender(); });
      }
      renderPanel(); render();
    }
    return;
  }
  const effectBtn = e.target.closest('[data-effect]');
  if(effectBtn){
    const o = state.layers[state.selected];
    if(o && o.type === 'text'){ o.effect = effectBtn.dataset.effect; renderPanel(); render(); }
    return;
  }
  const alignBtn = e.target.closest('[data-align]');
  if(alignBtn){
    const o = state.layers[state.selected];
    if(o && o.type === 'text'){ o.align = alignBtn.dataset.align; renderPanel(); render(); }
    return;
  }
  const toggleBtn = e.target.closest('[data-toggle]');
  if(toggleBtn){
    const o = state.layers[state.selected];
    if(o && o.type === 'text'){
      const key = toggleBtn.dataset.toggle;
      o[key] = !o[key];
      if(key === 'uppercase' && o[key]) o.lowercase = false;
      if(key === 'lowercase' && o[key]) o.uppercase = false;
      renderPanel(); render();
    }
    return;
  }
  const blendBtn = e.target.closest('[data-blend]');
  if(blendBtn){
    const o = state.layers[state.selected];
    if(o && o.type === 'image'){ o.blend = blendBtn.dataset.blend; renderPanel(); render(); }
    return;
  }
  const presetTextBtn = e.target.closest('[data-textpreset]');
  if(presetTextBtn){
    const p = TEXT_PRESETS[parseInt(presetTextBtn.dataset.textpreset,10)];
    if(p) addTextFromPreset(p); return;
  }
  const graphicBtn = e.target.closest('[data-graphic]');
  if(graphicBtn){ addGraphic(parseInt(graphicBtn.dataset.graphic,10)); return; }
  const solidBtn = e.target.closest('[data-solid]');
  if(solidBtn){ pushHistory(); state.bg.color = solidBtn.dataset.solid; invalidateBase(); renderPanel(); render(); return; }
  const gradBtn = e.target.closest('[data-gradient]');
  if(gradBtn){
    pushHistory();
    const g = GRADIENTS[parseInt(gradBtn.dataset.gradient,10)];
    if(g) state.bg.g = g.slice();
    invalidateBase(); renderPanel(); render(); return;
  }
  const bgModeBtn = e.target.closest('[data-bgmode]');
  if(bgModeBtn){
    pushHistory(); state.bg.type = bgModeBtn.dataset.bgmode;
    state.selected = -1; invalidateBase(); renderPanel(); render(); return;
  }
  const subShapeBtn = e.target.closest('[data-subshape]');
  if(subShapeBtn){
    state.subject.shape = subShapeBtn.dataset.subshape;
    state.subject.active = true;
    invalidateBase(); renderPanel(); requestRender(); return;
  }
  const subFxBtn = e.target.closest('[data-subfx]');
  if(subFxBtn){
    state.subject.effect = subFxBtn.dataset.subfx;
    if(state.subject.effect !== 'none' && !state.subject.active && state.image){
      const W = canvas.width, H = canvas.height;
      state.subject.x = W * 0.2; state.subject.y = H * 0.15;
      state.subject.w = W * 0.6; state.subject.h = H * 0.7;
      state.subject.active = true;
    }
    invalidateBase(); renderPanel(); render(); return;
  }
  const aspectBtn = e.target.closest('[data-aspect]');
  if(aspectBtn){
    state.crop.aspect = aspectBtn.dataset.aspect;
    applyAspectToCrop(); renderPanel(); requestRender(); return;
  }
  const layerRow = e.target.closest('[data-layer]');
  if(layerRow && !e.target.closest('[data-layervis]') && !e.target.closest('[data-layerlock]') &&
     !e.target.closest('[data-layerup]') && !e.target.closest('[data-layerdown]') &&
     !e.target.closest('[data-layerdup]') && !e.target.closest('[data-layerdel]') &&
     !e.target.closest('.layer-name')){
    state.selected = parseInt(layerRow.dataset.layer,10);
    renderPanel(); render(); return;
  }
  const lvBtn = e.target.closest('[data-layervis]');
  if(lvBtn){
    const i = parseInt(lvBtn.dataset.layervis,10);
    if(state.layers[i]){ pushHistory(); state.layers[i].visible = !state.layers[i].visible; renderPanel(); render(); }
    return;
  }
  const llBtn = e.target.closest('[data-layerlock]');
  if(llBtn){
    const i = parseInt(llBtn.dataset.layerlock,10);
    if(state.layers[i]){ pushHistory(); state.layers[i].locked = !state.layers[i].locked; renderPanel(); render(); }
    return;
  }
  const luBtn = e.target.closest('[data-layerup]');
  if(luBtn){ moveLayer(parseInt(luBtn.dataset.layerup,10), 1); return; }
  const ldBtn = e.target.closest('[data-layerdown]');
  if(ldBtn){ moveLayer(parseInt(ldBtn.dataset.layerdown,10), -1); return; }
  const ldupBtn = e.target.closest('[data-layerdup]');
  if(ldupBtn){ state.selected = parseInt(ldupBtn.dataset.layerdup,10); duplicateLayer(); return; }
  const ldelBtn = e.target.closest('[data-layerdel]');
  if(ldelBtn){ state.selected = parseInt(ldelBtn.dataset.layerdel,10); deleteLayer(); return; }
  const actBtn = e.target.closest('[data-act]');
  if(!actBtn) return;
  const act = actBtn.dataset.act;
  switch(act){
    case 'open': fileInput.click(); break;
    case 'uploadOverlay': overlayInput.click(); break;
    case 'export': exportImage(); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'togglePanel':
      state.panelVisible = !state.panelVisible;
      if(state.panelVisible){ panelEl.classList.remove('collapsed'); panelToggle.querySelector('svg').innerHTML = '<path d="M6 15l6-6 6 6"/>'; }
      else { panelEl.classList.add('collapsed'); panelToggle.querySelector('svg').innerHTML = '<path d="M6 9l6 6 6-6"/>'; }
      requestRender(); break;
    case 'resetPreset': pushHistory(); state.preset = 'none'; invalidateBase(); renderPanel(); render(); break;
    case 'resetAdjust':
      pushHistory();
      state.adj = { exposure:0, brightness:100, contrast:100, highlights:0, shadows:0, temperature:0, tint:0, vibrance:0, saturation:100, hue:0, sharpen:0, clarity:0, noiseRed:0, blur:0, vignette:0, grain:0, fade:0 };
      invalidateBase(); renderPanel(); render(); break;
    case 'addText': addTextLayer(); break;
    case 'gotoGraphics': state.tab = 'graphics'; renderTabs(); renderPanel(); break;
    case 'dupOverlay': duplicateLayer(); break;
    case 'delOverlay': deleteLayer(); break;
    case 'rotCW': rotateLayer(15); break;
    case 'rotCCW': rotateLayer(-15); break;
    case 'rot90': rotateLayer(90); break;
    case 'rotReset': resetLayerRotation(); break;
    case 'rotate90': rotateImage(); break;
    case 'flipH': flipImage(true); break;
    case 'flipV': flipImage(false); break;
    case 'applyCrop': applyCrop(); break;
    case 'resetCrop':
      state.crop.aspect = 'free'; state.crop.active = true;
      state.crop.x = 0; state.crop.y = 0;
      state.crop.w = canvas.width; state.crop.h = canvas.height;
      renderPanel(); requestRender(); break;
    case 'clearSubject': state.subject.active = false; state.subject.effect = 'none'; invalidateBase(); renderPanel(); render(); break;
    case 'selectAll':
      state.subject.active = true; state.subject.x = 0; state.subject.y = 0;
      state.subject.w = canvas.width; state.subject.h = canvas.height;
      invalidateBase(); renderPanel(); render(); break;
    case 'selectCenter':
      state.subject.active = true;
      state.subject.x = canvas.width * 0.2; state.subject.y = canvas.height * 0.15;
      state.subject.w = canvas.width * 0.6; state.subject.h = canvas.height * 0.7;
      if(state.subject.effect === 'none') state.subject.effect = 'blur';
      invalidateBase(); renderPanel(); render(); break;
    case 'flatten': flattenVisible(); break;
  }
});

panelBodyEl.addEventListener('input', function(e){
  const el = e.target;
  if(el.matches('[data-layername]')){
    const i = parseInt(el.dataset.layername,10);
    if(state.layers[i]) state.layers[i].name = el.value;
    return;
  }
  if(el.matches('[data-adj]')){
    const key = el.dataset.adj;
    const suffix = el.dataset.suffix || '';
    state.adj[key] = parseFloat(el.value);
    const out = panelBodyEl.querySelector('[data-out="' + key + '"]');
    if(out) out.textContent = el.value + suffix;
    const min = parseFloat(el.min), max = parseFloat(el.max);
    el.style.setProperty('--p', ((parseFloat(el.value) - min) / (max - min) * 100) + '%');
    baseDirty = true; requestRender(); return;
  }
  if(el.matches('[data-subrange]')){
    state.subject[el.dataset.subrange] = parseFloat(el.value);
    const out = panelBodyEl.querySelector('[data-out="sub-amt"]');
    if(out) out.textContent = el.value;
    const min = parseFloat(el.min), max = parseFloat(el.max);
    el.style.setProperty('--p', ((parseFloat(el.value) - min) / (max - min) * 100) + '%');
    baseDirty = true; requestRender(); return;
  }
  if(el.matches('[data-prop]')){
    const o = state.layers[state.selected]; if(!o) return;
    o[el.dataset.prop] = el.value;
    requestRender();
    return;
  }
  if(el.matches('[data-prop-range]')){
    const o = state.layers[state.selected]; if(!o) return;
    const key = el.dataset.propRange;
    const scale = el.dataset.scale ? parseFloat(el.dataset.scale) : (key === 'size' ? 0.01 : 1);
    const suffix = el.dataset.suffix || '';
    let v = parseFloat(el.value);
    if(key === 'size') v = v / 100; else v = v * scale;
    o[key] = v;
    const min = parseFloat(el.min), max = parseFloat(el.max);
    el.style.setProperty('--p', ((parseFloat(el.value) - min) / (max - min) * 100) + '%');
    const outMap = {
      size: (state.tab === 'text' ? 't-size' : 's-size'),
      spacing: 't-spacing', strokeWidth: 't-stroke', strokeW: 's-stroke',
      rotation: (state.tab === 'text' ? 't-rot' : 's-rot'),
      opacity: (state.tab === 'text' ? 't-opacity' : 's-opacity'),
      lineHeight: 't-lh'
    };
    const outId = outMap[key];
    if(outId){
      const out = panelBodyEl.querySelector('[data-out="' + outId + '"]');
      if(out){
        if(key === 'size') out.textContent = Math.round(o.size * 1000) / 10;
        else if(key === 'opacity') out.textContent = Math.round(o.opacity * 100) + '%';
        else if(key === 'lineHeight') out.textContent = o.lineHeight.toFixed(2);
        else if(key === 'strokeW') out.textContent = (o.strokeW||0).toFixed(1);
        else out.textContent = el.value + suffix;
      }
    }
    requestRender(); return;
  }
  if(el.matches('[data-bgcolor]')){ state.bg.color = el.value; invalidateBase(); render(); return; }
});

panelBodyEl.addEventListener('change', function(e){
  const el = e.target;
  if(el.matches('[data-prop-check]')){
    const o = state.layers[state.selected]; if(!o) return;
    o[el.dataset.propCheck] = el.checked; render();
  }
});

panelBodyEl.addEventListener('click', function(e){
  if(e.target.matches('.layer-name')) e.stopPropagation();
});

fileInput.addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0];
  if(f) loadImageFile(f);
  fileInput.value = '';
});

overlayInput.addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = function(){
    pushHistory();
    const o = createLayer({
      type:'image', name:'Image', src:url, img:img,
      x:0.5, y:0.5, size:0.4, rotation:0, opacity:1, blend:'normal'
    });
    state.layers.push(o);
    state.selected = state.layers.length - 1;
    state.tab = 'images';
    renderTabs(); renderPanel(); render();
  };
  img.onerror = function(){ URL.revokeObjectURL(url); };
  img.src = url;
  overlayInput.value = '';
});

stage.addEventListener('dragover', function(e){ e.preventDefault(); });
stage.addEventListener('drop', function(e){
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) loadImageFile(f);
});

window.addEventListener('resize', function(){ requestRender(); });

/* ============ INIT ============ */
renderTabs();
renderPanel();

if(document.fonts && document.fonts.load){
  const unique = Array.from(new Set(FONTS));
  unique.forEach(function(f){ document.fonts.load('700 60px "' + f + '"').catch(function(){}); });
}

})();
</script>
</body>
</html>
